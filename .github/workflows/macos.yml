name: macOS

on:
  push:
    branches: [main]
    tags: ["mac-v*"]
    paths: ["macos/**", ".github/workflows/macos.yml", "scripts/**", "windows/build/release_zip.py", ".github/release-policy.json"]
  pull_request:
    paths: ["macos/**", ".github/workflows/macos.yml", "scripts/**", "windows/build/release_zip.py", ".github/release-policy.json"]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('macos-pr-{0}', github.event.pull_request.number) || ((github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/mac-v')) && 'macos-stable') || format('macos-validation-{0}', github.ref) }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/mac-v'))
    runs-on: macos-15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Test version policy
        run: python -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Validate committed source version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            python scripts/versioning.py plan --platform macos --mode beta \
              --event-file "$GITHUB_EVENT_PATH" --ref "$GITHUB_REF" \
              --beta-sequence "${{ github.run_number }}.${{ github.run_attempt }}" \
              --github-output "$RUNNER_TEMP/macos-validation-plan.txt"
          fi
          # A non-main manual dispatch validates its source and bundle without
          # planning or publishing a stable release. Mac PR artifacts retain the
          # committed numeric Mac version; the Windows beta channel is separate.
          python - <<'PY'
          import os, pathlib, re
          source = pathlib.Path("macos/Sources/EvictKit/Version.swift").read_text()
          version = re.search(r'public static let current\s*=\s*"([^"]+)"', source).group(1)
          if not re.fullmatch(r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", version):
              raise SystemExit("Mac source version must be numeric x.y.z")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version={version}\n")
          PY

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Run tests
        working-directory: macos
        run: swift test

      - name: Build Evict.app (universal)
        working-directory: macos
        run: Scripts/make-app.sh --universal

      - name: Verify source and bundle versions
        working-directory: macos
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          test -x build/Evict.app/Contents/MacOS/Evict
          python - <<'PY'
          import os, pathlib, plistlib, re
          source = pathlib.Path("Sources/EvictKit/Version.swift").read_text()
          version = re.search(r'public static let current\s*=\s*"([^"]+)"', source).group(1)
          build = re.search(r'public static let build\s*=\s*"([^"]+)"', source).group(1)
          assert version == os.environ["EXPECTED_VERSION"], "Source version changed during build"
          assert re.fullmatch(r"[0-9]+", build), "Bundle build must be numeric"
          with open("build/Evict.app/Contents/Info.plist", "rb") as file:
              info = plistlib.load(file)
          assert info["CFBundleShortVersionString"] == version, "Bundle/source version mismatch"
          assert info["CFBundleVersion"] == build, "Bundle/source build mismatch"
          PY
          lipo -info build/Evict.app/Contents/MacOS/Evict
          lipo -verify_arch arm64 x86_64 build/Evict.app/Contents/MacOS/Evict
          codesign --verify --verbose=2 build/Evict.app

      - name: Fetch verified Windows stable components from main
        id: windows_components
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin +refs/heads/main:refs/remotes/origin/main --tags
          python scripts/fetch_windows_bundle.py \
            --out "$RUNNER_TEMP/evict-windows-components" --github-output "$GITHUB_OUTPUT"

      - name: Package all installation folders
        env:
          MAC_VERSION: ${{ steps.version.outputs.version }}
          WINDOWS_VERSION: ${{ steps.windows_components.outputs.windows_version }}
        run: |
          set -euo pipefail
          native_archive="$RUNNER_TEMP/Evict-macOS-$MAC_VERSION.zip"
          cp "macos/build/Evict-$MAC_VERSION.zip" "$native_archive"
          python windows/build/release_zip.py "$WINDOWS_VERSION" \
            --setup "$RUNNER_TEMP/evict-windows-components/windows-installer" \
            --exe "$RUNNER_TEMP/evict-windows-components/portable" \
            --macos "$native_archive" --out macos/build/distribution \
            --archive-version "$MAC_VERSION"
          python windows/build/release_zip.py --check "macos/build/distribution/Evict-$MAC_VERSION.zip"
          # Upload the three folders themselves so the Actions artifact download
          # also has the required top-level layout rather than an extra ZIP layer.
          python - "$MAC_VERSION" "$RUNNER_TEMP/evict-macos-delivery" <<'PY'
          import pathlib, sys, zipfile
          archive = pathlib.Path("macos/build/distribution") / f"Evict-{sys.argv[1]}.zip"
          destination = pathlib.Path(sys.argv[2])
          destination.mkdir(parents=True, exist_ok=False)
          with zipfile.ZipFile(archive) as bundle:
              bundle.extractall(destination)
          PY
          python windows/build/release_zip.py --check-folder "$RUNNER_TEMP/evict-macos-delivery"

      - name: Upload installation folders
        uses: actions/upload-artifact@v7
        with:
          name: Evict-macOS-validation
          path: ${{ runner.temp }}/evict-macos-delivery/
          if-no-files-found: error

  release:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/mac-v'))
    runs-on: macos-15
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Test version policy
        run: python -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Prepare exact release source
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          plan_output="$RUNNER_TEMP/macos-release-plan.txt"
          tested_source="$(git rev-parse HEAD)"
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            prepared=false
            for attempt in 1 2 3; do
              git fetch origin +refs/heads/main:refs/remotes/origin/main --tags
              git checkout --detach origin/main
              if [ "$(git rev-parse HEAD)" != "$tested_source" ]; then
                python -m unittest discover -s scripts/tests -p 'test_*.py'
                tested_source="$(git rev-parse HEAD)"
              fi
              : > "$plan_output"
              python scripts/versioning.py plan --platform macos --mode stable \
                --event-file "$GITHUB_EVENT_PATH" --ref "$GITHUB_REF" \
                --main-ref origin/main --github-output "$plan_output" --sync
              while IFS= read -r changed; do
                case "$changed" in
                  ""|macos/Sources/EvictKit/Version.swift|macos/CHANGELOG.md) ;;
                  *) echo "::error::Unexpected generated file: $changed"; exit 1 ;;
                esac
              done < <(git diff --name-only)
              git add -- macos/Sources/EvictKit/Version.swift macos/CHANGELOG.md
              if git diff --cached --quiet; then
                prepared=true
                break
              fi
              planned_version="$(python - "$plan_output" <<'PY'
          import pathlib, sys
          values = dict(line.split("=", 1) for line in pathlib.Path(sys.argv[1]).read_text().splitlines() if "=" in line)
          print(values["version"])
          PY
              )"
              git commit -m "chore(release): macos $planned_version"
              if git push origin HEAD:refs/heads/main; then
                prepared=true
                break
              fi
              echo "::notice::Main advanced; recomputing Mac release (attempt $attempt of 3)"
            done
            if [ "$prepared" != true ]; then
              echo "::error::Main kept advancing; no release source was prepared"
              exit 1
            fi
          else
            tag="${GITHUB_REF#refs/tags/}"
            if [[ ! "$tag" =~ ^mac-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "::error::Mac releases require a stable mac-vx.y.z tag"
              exit 1
            fi
            : > "$plan_output"
            python scripts/versioning.py plan --platform macos --mode tag \
              --event-file "$GITHUB_EVENT_PATH" --ref "$GITHUB_REF" --tag "$tag" \
              --github-output "$plan_output"
          fi
          cp scripts/versioning.py "$RUNNER_TEMP/macos-versioning.py"
          cat "$plan_output" >> "$GITHUB_OUTPUT"
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Resolve release and retry source
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          PLANNED_TAG: ${{ steps.prepare.outputs.tag }}
          PLANNED_VERSION: ${{ steps.prepare.outputs.core_version }}
          PLANNED_PUBLISH: ${{ steps.prepare.outputs.publish }}
          PLANNED_BUMP: ${{ steps.prepare.outputs.bump }}
          BASE_TAG: ${{ steps.prepare.outputs.base_tag }}
          PREPARED_SOURCE_SHA: ${{ steps.prepare.outputs.source_sha }}
        run: |
          set -euo pipefail
          tag="$PLANNED_TAG"
          source_sha="$PREPARED_SOURCE_SHA"
          publish="$PLANNED_PUBLISH"
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" > "$RUNNER_TEMP/macos-release.json" 2> "$RUNNER_TEMP/macos-release-error.txt"; then
            draft="$(python - "$RUNNER_TEMP/macos-release.json" <<'PY'
          import json, sys
          print(str(json.load(open(sys.argv[1]))["draft"]).lower())
          PY
            )"
            if [ "$draft" = false ]; then
              echo "::notice::Release $tag is already published; keeping its assets unchanged"
              echo "publish=false" >> "$GITHUB_OUTPUT"
              echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            publish=true
          elif grep -q 'HTTP 404' "$RUNNER_TEMP/macos-release-error.txt"; then
            if git rev-parse -q --verify "refs/tags/$tag^{commit}" >/dev/null; then
              publish=true
            fi
          else
            cat "$RUNNER_TEMP/macos-release-error.txt" >&2
            exit 1
          fi
          if [ "$publish" = true ] && tag_source="$(git rev-parse -q --verify "refs/tags/$tag^{commit}")"; then
            if [ "$source_sha" != "$tag_source" ] && { [ "$PLANNED_BUMP" != none ] || [ "$BASE_TAG" != "$tag" ]; }; then
              echo "::error::Existing tag $tag targets another source commit"
              exit 1
            fi
            git checkout --detach "$tag_source"
            python "$RUNNER_TEMP/macos-versioning.py" plan --repo-root "$GITHUB_WORKSPACE" \
              --platform macos --mode tag --event-file "$GITHUB_EVENT_PATH" \
              --ref "refs/tags/$tag" --tag "$tag" --github-output "$RUNNER_TEMP/macos-retry-plan.txt"
            python - "$RUNNER_TEMP/macos-retry-plan.txt" "$PLANNED_VERSION" <<'PY'
          import pathlib, sys
          values = dict(line.split("=", 1) for line in pathlib.Path(sys.argv[1]).read_text().splitlines() if "=" in line)
          assert values["core_version"] == sys.argv[2], "Tagged source version differs from planned release"
          PY
            source_sha="$tag_source"
          fi
          test "$(git rev-parse HEAD)" = "$source_sha"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Run tests
        working-directory: macos
        run: swift test

      - name: Build Evict.app (universal)
        working-directory: macos
        run: Scripts/make-app.sh --universal

      - name: Verify release source and bundle versions
        working-directory: macos
        env:
          EXPECTED_VERSION: ${{ steps.prepare.outputs.core_version }}
          EXPECTED_TAG: ${{ steps.prepare.outputs.tag }}
          EXPECTED_SOURCE_SHA: ${{ steps.publish.outputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test "$EXPECTED_TAG" = "mac-v$EXPECTED_VERSION"
          test -x build/Evict.app/Contents/MacOS/Evict
          python - <<'PY'
          import os, pathlib, plistlib, re
          source = pathlib.Path("Sources/EvictKit/Version.swift").read_text()
          version = re.search(r'public static let current\s*=\s*"([^"]+)"', source).group(1)
          build = re.search(r'public static let build\s*=\s*"([^"]+)"', source).group(1)
          assert version == os.environ["EXPECTED_VERSION"], "Source/tag version mismatch"
          assert re.fullmatch(r"[0-9]+", build), "Bundle build must be numeric"
          with open("build/Evict.app/Contents/Info.plist", "rb") as file:
              info = plistlib.load(file)
          assert info["CFBundleShortVersionString"] == version, "Bundle/source version mismatch"
          assert info["CFBundleVersion"] == build, "Bundle/source build mismatch"
          PY
          lipo -info build/Evict.app/Contents/MacOS/Evict
          lipo -verify_arch arm64 x86_64 build/Evict.app/Contents/MacOS/Evict
          codesign --verify --verbose=2 build/Evict.app

      - name: Fetch verified Windows stable components from main
        id: windows_components
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin +refs/heads/main:refs/remotes/origin/main --tags
          python scripts/fetch_windows_bundle.py \
            --out "$RUNNER_TEMP/evict-windows-components" --github-output "$GITHUB_OUTPUT"

      - name: Package all installation folders
        env:
          MAC_VERSION: ${{ steps.prepare.outputs.core_version }}
          WINDOWS_VERSION: ${{ steps.windows_components.outputs.windows_version }}
        run: |
          set -euo pipefail
          native_archive="$RUNNER_TEMP/Evict-macOS-$MAC_VERSION.zip"
          cp "macos/build/Evict-$MAC_VERSION.zip" "$native_archive"
          python windows/build/release_zip.py "$WINDOWS_VERSION" \
            --setup "$RUNNER_TEMP/evict-windows-components/windows-installer" \
            --exe "$RUNNER_TEMP/evict-windows-components/portable" \
            --macos "$native_archive" --out macos/build/distribution \
            --archive-version "$MAC_VERSION"
          python windows/build/release_zip.py --check "macos/build/distribution/Evict-$MAC_VERSION.zip"
          # Upload the three folders themselves so the Actions artifact download
          # also has the required top-level layout rather than an extra ZIP layer.
          python - "$MAC_VERSION" "$RUNNER_TEMP/evict-macos-delivery" <<'PY'
          import pathlib, sys, zipfile
          archive = pathlib.Path("macos/build/distribution") / f"Evict-{sys.argv[1]}.zip"
          destination = pathlib.Path(sys.argv[2])
          destination.mkdir(parents=True, exist_ok=False)
          with zipfile.ZipFile(archive) as bundle:
              bundle.extractall(destination)
          PY
          python windows/build/release_zip.py --check-folder "$RUNNER_TEMP/evict-macos-delivery"

      - name: Upload installation folders
        uses: actions/upload-artifact@v7
        with:
          name: Evict-app
          path: ${{ runner.temp }}/evict-macos-delivery/
          if-no-files-found: error

      - name: Release notes from CHANGELOG.md
        if: steps.publish.outputs.publish == 'true'
        working-directory: macos
        env:
          RELEASE_VERSION: ${{ steps.prepare.outputs.core_version }}
        run: |
          awk -v version="$RELEASE_VERSION" '
            /^## / { if (inside) exit; inside = ($2 == version); next }
            inside' CHANGELOG.md > "$RUNNER_TEMP/macos-release-notes.md"
          test -s "$RUNNER_TEMP/macos-release-notes.md" || {
            echo "::error::CHANGELOG.md has no section for $RELEASE_VERSION"
            exit 1
          }

      - name: Recheck publication status
        if: steps.publish.outputs.publish == 'true'
        id: final_publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$RUNNER_TEMP/macos-final-release.json" 2> "$RUNNER_TEMP/macos-final-release-error.txt"; then
            python - "$RUNNER_TEMP/macos-final-release.json" <<'PY'
          import json, os, sys
          release = json.load(open(sys.argv[1]))
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"publish={str(release['draft']).lower()}\n")
          if not release["draft"]:
              print("Release is now published; keeping its assets unchanged")
          PY
          elif grep -q 'HTTP 404' "$RUNNER_TEMP/macos-final-release-error.txt"; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            cat "$RUNNER_TEMP/macos-final-release-error.txt" >&2
            exit 1
          fi

      - name: Release
        if: steps.publish.outputs.publish == 'true' && steps.final_publish.outputs.publish == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.prepare.outputs.tag }}
          target_commitish: ${{ steps.publish.outputs.source_sha }}
          name: Evict ${{ steps.prepare.outputs.core_version }} for macOS
          body_path: ${{ runner.temp }}/macos-release-notes.md
          files: |
            macos/build/distribution/Evict-${{ steps.prepare.outputs.core_version }}.zip
            macos/build/distribution/Evict-${{ steps.prepare.outputs.core_version }}.zip.sha256
          generate_release_notes: true
          draft: false
          prerelease: false
          make_latest: false
