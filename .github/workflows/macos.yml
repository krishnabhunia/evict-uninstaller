name: macOS

on:
  push:
    branches: [main]
    tags: ["mac-v*"]
    paths: ["macos/**", ".github/workflows/macos.yml"]
  pull_request:
    paths: ["macos/**", ".github/workflows/macos.yml"]
  workflow_dispatch:

# The Release step needs to write to the repository; new repos hand workflows a read-only token.
permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Run tests
        run: swift test

      - name: Build Evict.app (universal)
        run: Scripts/make-app.sh --universal

      - name: Verify the bundle
        run: |
          test -x build/Evict.app/Contents/MacOS/Evict
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" build/Evict.app/Contents/Info.plist
          lipo -info build/Evict.app/Contents/MacOS/Evict
          codesign --verify --verbose=2 build/Evict.app

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: Evict-app
          path: |
            macos/build/Evict-*.zip
            macos/build/Evict-*.zip.sha256
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/mac-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            macos/build/Evict-*.zip
            macos/build/Evict-*.zip.sha256
          generate_release_notes: true
          # Never "latest": installed Windows copies (1.3.x) update from releases/latest.
          make_latest: false
