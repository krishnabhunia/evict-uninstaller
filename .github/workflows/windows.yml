name: Windows

on:
  push:
    branches: [ main ]
    tags: [ 'win-v*', '!win-v*-beta.*' ]
    paths: [ 'windows/**', '.github/workflows/windows.yml' ]
  pull_request:
    branches: [ main ]
    paths: [ 'windows/**', '.github/workflows/windows.yml' ]
  workflow_dispatch:

permissions:
  contents: write

# Continuous delivery: a push to main whose <Version> has no win-v tag yet builds, tags and publishes that version.
# One release at a time, so two quick merges cannot both create the same tag.
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # Keep stable delivery on main/tags unchanged; PR code builds in a separate read-only job below.
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    env:
      # Optional Authenticode signing – both steps below are skipped while these secrets are empty.
      # SIGN_PFX_BASE64: base64 of a .pfx code-signing certificate, SIGN_PFX_PASSWORD: its password.
      SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
      SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
    steps: &windows_build_steps
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tags, to tell whether this version is already released
          # PR betas test the exact source snapshot that will be tagged, never GitHub's synthetic merge commit.
          ref: ${{ needs.prepare-beta.outputs.source_sha || github.event.pull_request.head.sha || github.sha }}

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $v = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Expected a stable major.minor.patch version, found $v" }
          $numeric = "$v.0"
          if ("${{ github.event_name }}" -eq "pull_request") {
            $parts = $v.Split('.')
            $next = "$($parts[0]).$($parts[1]).$([int]$parts[2] + 1)"
            $v = "$next-beta.${{ github.event.pull_request.number }}.${{ github.run_number }}.${{ github.run_attempt }}"
            $numeric = "$next.0"
          }
          $source = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { throw "Could not read the checked-out source commit" }
          "version=$v" >> $env:GITHUB_OUTPUT
          "numeric_version=$numeric" >> $env:GITHUB_OUTPUT
          "source_sha=$source" >> $env:GITHUB_OUTPUT
          "artifact=Evict-$v-$source" >> $env:GITHUB_OUTPUT
          Write-Host "Version $v from $source (numeric file version $numeric)"

      - name: Release needed?
        id: rel
        shell: pwsh
        run: |
          $tag = "win-v${{ steps.ver.outputs.version }}"
          $ref = "${{ github.ref }}"
          if ($ref -eq "refs/tags/$tag") { $publish = "true" }
          elseif ($ref.StartsWith("refs/tags/win-v")) { throw "Tag $ref does not match <Version> ${{ steps.ver.outputs.version }} in Directory.Build.props" }
          elseif ("${{ github.event_name }}" -eq "push" -and $ref -eq "refs/heads/main") {
            git rev-parse -q --verify "refs/tags/$tag" | Out-Null
            $publish = if ($LASTEXITCODE -eq 0) { "false" } else { "true" }
          }
          else { $publish = "false" }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "publish=$publish" >> $env:GITHUB_OUTPUT
          Write-Host "Release $tag : $publish"
          $global:LASTEXITCODE = 0

      - name: Restore
        run: dotnet restore Evict.sln

      - name: Unit tests
        run: dotnet test tests/Evict.Core.Tests/Evict.Core.Tests.csproj -c Release --no-restore -p:Version=${{ steps.ver.outputs.version }} -p:InformationalVersion=${{ steps.ver.outputs.version }} --logger "trx;LogFileName=tests.trx"

      - name: XAML sanity checks
        env:
          PYTHONUTF8: "1"
        run: python build/xaml_check.py

      - name: Publish single-file EXE
        run: dotnet publish src/Evict.App/Evict.App.csproj -c Release -o Portable -p:Version=${{ steps.ver.outputs.version }} -p:InformationalVersion=${{ steps.ver.outputs.version }}

      - name: Sign Evict.exe (optional)
        if: env.SIGN_PFX_BASE64 != ''
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\sign.pfx", [Convert]::FromBase64String($env:SIGN_PFX_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          & $signtool.FullName sign /f "$env:RUNNER_TEMP\sign.pfx" /p $env:SIGN_PFX_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 Portable\Evict.exe
          Remove-Item "$env:RUNNER_TEMP\sign.pfx" -Force

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y | Out-Null }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found" }
          & $iscc "/DMyAppVersion=${{ steps.ver.outputs.version }}" "/DMyAppNumericVersion=${{ steps.ver.outputs.numeric_version }}" "/DSourceDir=$PWD\Portable" installer\Evict.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
          Get-ChildItem Installed

      - name: Sign installer (optional)
        if: env.SIGN_PFX_BASE64 != ''
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\sign.pfx", [Convert]::FromBase64String($env:SIGN_PFX_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          Get-ChildItem Installed\*.exe | ForEach-Object { & $signtool.FullName sign /f "$env:RUNNER_TEMP\sign.pfx" /p $env:SIGN_PFX_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $_.FullName }
          Remove-Item "$env:RUNNER_TEMP\sign.pfx" -Force

      - name: Checksums
        shell: pwsh
        run: |
          (Get-FileHash Portable/Evict.exe -Algorithm SHA256).Hash | Out-File Portable/Evict.exe.sha256 -Encoding ascii
          Get-ChildItem Installed\*.exe | ForEach-Object { (Get-FileHash $_.FullName -Algorithm SHA256).Hash | Out-File "$($_.FullName).sha256" -Encoding ascii }

      # Release zip (Krishna's standing rule): Evict-<version>.zip holds exactly two folders — installer\ (the setup)
      # and portable\ (Evict.exe). The script refuses anything else.
      - name: Release zip (installer + portable)
        run: python build/release_zip.py ${{ steps.ver.outputs.version }} --setup Installed --exe Portable --out Zip

      # The CI download follows the same rule as the release zip: only installer\ and portable\ inside.
      - name: Unpack the zip for the CI download
        shell: pwsh
        run: |
          Expand-Archive Zip/Evict-${{ steps.ver.outputs.version }}.zip -DestinationPath CiDownload
          python build/release_zip.py --check-folder CiDownload

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ver.outputs.artifact }}
          path: windows/CiDownload/
          if-no-files-found: error

      # Transport the already checked ZIP without rebuilding it in the privileged publication job.
      - name: Upload beta ZIP for publication
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' && github.event.pull_request.user.login != 'dependabot[bot]'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ver.outputs.artifact }}-release-zip
          path: windows/Zip/
          if-no-files-found: error

      - name: Release notes from CHANGELOG.md
        if: steps.rel.outputs.publish == 'true'
        shell: pwsh
        run: |
          $v = [regex]::Escape("${{ steps.ver.outputs.version }}")
          $out = @(); $in = $false
          foreach ($line in Get-Content CHANGELOG.md -Encoding utf8) {
            # Unpublished versions ride along with the next published one, so their sections are included too.
            if ($line -match '^## ') {
              if ($in) { if ($line -match '\(not published\)') { $out += '', $line; continue } else { break } }
              $in = $line -match "^## $v\b"; continue
            }
            if ($in) { $out += $line }
          }
          if (-not $out) { throw "CHANGELOG.md has no '## ${{ steps.ver.outputs.version }}' section" }
          ($out -join "`n").Trim() | Out-File "$env:RUNNER_TEMP\notes.md" -Encoding utf8

      - name: GitHub Release
        if: steps.rel.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          # Creates the tag on this commit when it does not exist yet (push to main).
          tag_name: ${{ steps.rel.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Evict ${{ steps.ver.outputs.version }} for Windows
          body_path: ${{ runner.temp }}/notes.md
          files: |
            windows/Portable/Evict.exe
            windows/Portable/Evict.exe.sha256
            windows/Installed/*.exe
            windows/Installed/*.sha256
            windows/Zip/Evict-*.zip
            windows/Zip/Evict-*.zip.sha256
          generate_release_notes: true
          # Installed copies of Evict 1.3.x read releases/latest - only Windows releases may be "latest".
          make_latest: true

      # A release published before the zip existed (1.8.0) gets it once, made from that release's own files —
      # nothing is rebuilt, so the zip holds exactly what was released.
      - name: Add the zip to the current release if it has none
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.rel.outputs.publish != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.rel.outputs.tag }}"; $v = "${{ steps.ver.outputs.version }}"; $repo = "${{ github.repository }}"
          $assets = gh release view $tag --repo $repo --json assets --jq '.assets[].name' 2>$null
          if ($LASTEXITCODE -ne 0) { Write-Host "No release $tag"; $global:LASTEXITCODE = 0; exit 0 }
          if ($assets -contains "Evict-$v.zip") { Write-Host "$tag already has Evict-$v.zip"; exit 0 }
          $d = Join-Path $env:RUNNER_TEMP "zip-$v"
          gh release download $tag --repo $repo --dir "$d\Installed" --pattern "Evict-Setup-*.exe"
          gh release download $tag --repo $repo --dir "$d\Portable" --pattern "Evict.exe"
          python build/release_zip.py $v --setup "$d\Installed" --exe "$d\Portable" --out "$d\Zip"
          if ($LASTEXITCODE -ne 0) { throw "Couldn't build the zip for $tag" }
          gh release upload $tag --repo $repo "$d\Zip\Evict-$v.zip" "$d\Zip\Evict-$v.zip.sha256"
          Write-Host "Added Evict-$v.zip to $tag"

  # A preview source commit contains every PR file unchanged except .github/workflows, which matches the default
  # branch. GitHub forbids GITHUB_TOKEN release creation for targets that modify workflows; no PAT is needed here.
  prepare-beta:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      source_sha: ${{ steps.snapshot.outputs.source_sha }}
      temp_ref: ${{ steps.snapshot.outputs.temp_ref }}
    steps:
      - name: Prepare beta source without workflow changes
        id: snapshot
        uses: actions/github-script@v7
        with:
          script: |
            const repo = context.repo;
            const pr = context.payload.pull_request;
            if (!pr || pr.head.repo.full_name !== process.env.GITHUB_REPOSITORY ||
                context.actor === 'dependabot[bot]' || pr.user.login === 'dependabot[bot]') {
              throw new Error('Only trusted same-repository PRs can prepare beta sources.');
            }
            const {data: metadata} = await github.rest.repos.get(repo);
            const {data: baseRef} = await github.rest.git.getRef({...repo, ref: 'heads/' + metadata.default_branch});
            const {data: base} = await github.rest.git.getCommit({...repo, commit_sha: baseRef.object.sha});
            const {data: head} = await github.rest.git.getCommit({...repo, commit_sha: pr.head.sha});
            async function workflows(treeSha) {
              const {data: root} = await github.rest.git.getTree({...repo, tree_sha: treeSha});
              const gh = root.tree.find(entry => entry.path === '.github' && entry.type === 'tree');
              if (!gh) return null;
              const {data: config} = await github.rest.git.getTree({...repo, tree_sha: gh.sha});
              return config.tree.find(entry => entry.path === 'workflows' && entry.type === 'tree')?.sha ?? null;
            }
            const defaultWorkflows = await workflows(base.tree.sha);
            if (await workflows(head.tree.sha) === defaultWorkflows) {
              core.setOutput('source_sha', head.sha);
              core.setOutput('temp_ref', '');
              return;
            }
            const {data: tree} = await github.rest.git.createTree({
              ...repo, base_tree: head.tree.sha,
              tree: [{path: '.github/workflows', mode: '040000', type: 'tree', sha: defaultWorkflows}]
            });
            async function applicationEntries(treeSha) {
              const {data: result} = await github.rest.git.getTree({...repo, tree_sha: treeSha, recursive: 'true'});
              if (result.truncated) throw new Error('Cannot verify a truncated source tree.');
              return result.tree
                .filter(entry => entry.path !== '.github' && entry.path !== '.github/workflows' &&
                                 !entry.path.startsWith('.github/workflows/'))
                .map(({path, mode, type, sha}) => ({path, mode, type, sha}))
                .sort((a, b) => a.path.localeCompare(b.path));
            }
            if (JSON.stringify(await applicationEntries(head.tree.sha)) !==
                JSON.stringify(await applicationEntries(tree.sha)) ||
                await workflows(tree.sha) !== defaultWorkflows) {
              throw new Error('Beta snapshot changed files outside the workflow subtree.');
            }
            const {data: snapshot} = await github.rest.git.createCommit({
              ...repo, tree: tree.sha, parents: [base.sha],
              message: 'Windows beta source for PR #' + pr.number + '\n\nOriginal PR head: ' + head.sha +
                       '\nApplication, tests and documentation match the PR exactly. Workflows match default branch ' + base.sha + '.'
            });
            const ref = 'heads/beta-build/pr-' + pr.number + '/run-' + context.runId + '-attempt-' + process.env.GITHUB_RUN_ATTEMPT;
            await github.rest.git.createRef({...repo, ref: 'refs/' + ref, sha: snapshot.sha});
            core.setOutput('source_sha', snapshot.sha);
            core.setOutput('temp_ref', ref);
            await core.summary.addHeading('Windows beta source')
              .addRaw('Original PR head: ' + head.sha + '\n\nRelease source snapshot: ' + snapshot.sha +
                      '\n\nAll non-workflow tree entries verified identical.').write();

  pr-build:
    needs: prepare-beta
    if: always() && github.event_name == 'pull_request' && (needs.prepare-beta.result == 'success' || github.event.pull_request.head.repo.full_name != github.repository || github.actor == 'dependabot[bot]' || github.event.pull_request.user.login == 'dependabot[bot]')
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: windows
    env:
      # Forks and Dependabot keep CI, with read-only credentials and no signing secrets.
      SIGN_PFX_BASE64: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' && github.event.pull_request.user.login != 'dependabot[bot]' && secrets.SIGN_PFX_BASE64 || '' }}
      SIGN_PFX_PASSWORD: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' && github.event.pull_request.user.login != 'dependabot[bot]' && secrets.SIGN_PFX_PASSWORD || '' }}
    outputs:
      version: ${{ steps.ver.outputs.version }}
      source_sha: ${{ steps.ver.outputs.source_sha }}
      artifact: ${{ steps.ver.outputs.artifact }}
    steps: *windows_build_steps

  publish-beta:
    needs: pr-build
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.pr-build.outputs.artifact }}
          path: Download
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.pr-build.outputs.artifact }}-release-zip
          path: Zip

      - name: Verify beta assets before publication
        id: beta_assets
        shell: pwsh
        env:
          BETA_VERSION: ${{ needs.pr-build.outputs.version }}
        run: |
          $v = $env:BETA_VERSION
          $files = @("Download/portable/Evict.exe", "Download/installer/Evict-Setup-$v.exe", "Zip/Evict-$v.zip")
          $assetSizes = @{}
          foreach ($file in $files) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "Missing beta asset: $file" }
            $expected = (Get-Content -LiteralPath "$file.sha256" -Raw).Trim()
            if ($expected -notmatch '^[a-fA-F0-9]{64}$' -or (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash -ne $expected) {
              throw "Beta checksum mismatch: $file"
            }
            $assetSizes[[IO.Path]::GetFileName($file)] = (Get-Item -LiteralPath $file).Length
            $assetSizes[[IO.Path]::GetFileName("$file.sha256")] = (Get-Item -LiteralPath "$file.sha256").Length
          }
          "sizes=$($assetSizes | ConvertTo-Json -Compress)" >> $env:GITHUB_OUTPUT
          $archive = [IO.Compression.ZipFile]::OpenRead((Resolve-Path -LiteralPath "Zip/Evict-$v.zip"))
          try {
            $actual = @($archive.Entries | ForEach-Object { $_.FullName.Replace('\', '/') } | Sort-Object)
            $expected = @("installer/Evict-Setup-$v.exe", "installer/Evict-Setup-$v.exe.sha256", "portable/Evict.exe", "portable/Evict.exe.sha256") | Sort-Object
            if (@(Compare-Object $expected $actual).Count -ne 0) { throw "Beta ZIP must contain only the installer/ and portable/ assets and checksums" }
          }
          finally { $archive.Dispose() }

      - name: Confirm release source workflow permissions
        uses: actions/github-script@v7
        env:
          BETA_SOURCE_SHA: ${{ needs.pr-build.outputs.source_sha }}
          BETA_VERSION: ${{ needs.pr-build.outputs.version }}
        with:
          script: |
            async function workflows(commitSha) {
              const {data: commit} = await github.rest.git.getCommit({...context.repo, commit_sha: commitSha});
              const {data: root} = await github.rest.git.getTree({...context.repo, tree_sha: commit.tree.sha});
              const gh = root.tree.find(entry => entry.path === '.github' && entry.type === 'tree');
              if (!gh) return null;
              const {data: config} = await github.rest.git.getTree({...context.repo, tree_sha: gh.sha});
              return config.tree.find(entry => entry.path === 'workflows' && entry.type === 'tree')?.sha ?? null;
            }
            const {data: repo} = await github.rest.repos.get(context.repo);
            const {data: base} = await github.rest.git.getRef({...context.repo, ref: 'heads/' + repo.default_branch});
            if (await workflows(base.object.sha) !== await workflows(process.env.BETA_SOURCE_SHA)) {
              throw new Error('Default-branch workflows changed during this beta build. Rerun to prepare a fresh source snapshot.');
            }
            // Create the tag only after tests, packaging and checksum validation succeeded. Drafts may defer tag creation.
            const ref = 'tags/win-v' + process.env.BETA_VERSION;
            let tag;
            try { tag = (await github.rest.git.getRef({...context.repo, ref})).data; }
            catch (error) {
              if (error.status !== 404) throw error;
              tag = (await github.rest.git.createRef({...context.repo, ref: 'refs/' + ref, sha: process.env.BETA_SOURCE_SHA})).data;
            }
            if (tag.object.type !== 'commit' || tag.object.sha !== process.env.BETA_SOURCE_SHA) {
              throw new Error('The beta tag already identifies another source; refusing to overwrite it.');
            }

      # Keep the release a draft until every asset is uploaded and its name, size and source tag are verified.
      - name: Upload beta draft
        id: beta_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: win-v${{ needs.pr-build.outputs.version }}
          target_commitish: ${{ needs.pr-build.outputs.source_sha }}
          name: Evict ${{ needs.pr-build.outputs.version }} for Windows (PR #${{ github.event.pull_request.number }})
          draft: true
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          body: |
            Beta preview of [PR #${{ github.event.pull_request.number }}](https://github.com/${{ github.repository }}/pull/${{ github.event.pull_request.number }}).
            Original PR head: ${{ github.event.pull_request.head.sha }}
            Built and tested release source: ${{ needs.pr-build.outputs.source_sha }}
            All application, test and documentation files match the PR head. Only .github/workflows matches the default branch so GitHub Actions can publish without an additional token.
            The release ZIP contains only installer/ and portable/, each with its SHA-256 checksum.
          files: |
            Download/portable/Evict.exe
            Download/portable/Evict.exe.sha256
            Download/installer/*.exe
            Download/installer/*.sha256
            Zip/Evict-*.zip
            Zip/Evict-*.zip.sha256

      - name: Publish verified beta without changing latest
        uses: actions/github-script@v7
        env:
          BETA_VERSION: ${{ needs.pr-build.outputs.version }}
          BETA_SOURCE_SHA: ${{ needs.pr-build.outputs.source_sha }}
          BETA_RELEASE_ID: ${{ steps.beta_release.outputs.id }}
          BETA_ASSET_SIZES: ${{ steps.beta_assets.outputs.sizes }}
        with:
          script: |
            const version = process.env.BETA_VERSION;
            const release_id = Number(process.env.BETA_RELEASE_ID);
            if (!Number.isSafeInteger(release_id) || release_id <= 0) throw new Error('No draft release was created.');
            const {data: release} = await github.rest.repos.getRelease({...context.repo, release_id});
            if (!release.draft || !release.prerelease || release.tag_name !== 'win-v' + version) {
              throw new Error('The beta draft has unexpected release metadata.');
            }
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {...context.repo, release_id, per_page: 100});
            const sizes = JSON.parse(process.env.BETA_ASSET_SIZES);
            const expected = ['Evict.exe', 'Evict.exe.sha256', 'Evict-Setup-' + version + '.exe',
              'Evict-Setup-' + version + '.exe.sha256', 'Evict-' + version + '.zip', 'Evict-' + version + '.zip.sha256'].sort();
            if (JSON.stringify(assets.map(a => a.name).sort()) !== JSON.stringify(expected) ||
                assets.some(a => a.size <= 0 || a.size !== sizes[a.name] || a.state !== 'uploaded')) {
              throw new Error('Beta draft assets are incomplete; leaving the release unpublished.');
            }
            const {data: tag} = await github.rest.git.getRef({...context.repo, ref: 'tags/win-v' + version});
            let target = tag.object;
            while (target.type === 'tag') {
              const {data: annotated} = await github.rest.git.getTag({...context.repo, tag_sha: target.sha});
              target = annotated.object;
            }
            if (target.type !== 'commit' || target.sha !== process.env.BETA_SOURCE_SHA) {
              throw new Error('Beta tag does not point to the tested source commit.');
            }
            const {data: published} = await github.rest.repos.updateRelease({
              ...context.repo, release_id, draft: false, prerelease: true, make_latest: 'false'
            });
            if (published.draft || !published.prerelease) throw new Error('Beta publication was not confirmed.');
            await core.summary.addHeading('Windows beta published')
              .addLink(version, published.html_url).write();

  cleanup-beta-source:
    needs: [prepare-beta, pr-build, publish-beta]
    if: always() && needs.prepare-beta.outputs.temp_ref != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Remove this run's temporary source ref
        uses: actions/github-script@v7
        env:
          BETA_TEMP_REF: ${{ needs.prepare-beta.outputs.temp_ref }}
          BETA_SOURCE_SHA: ${{ needs.prepare-beta.outputs.source_sha }}
        with:
          script: |
            const ref = process.env.BETA_TEMP_REF;
            const prefix = 'heads/beta-build/pr-' + context.payload.pull_request.number + '/run-' + context.runId + '-attempt-';
            const attempt = ref.startsWith(prefix) ? ref.slice(prefix.length) : '';
