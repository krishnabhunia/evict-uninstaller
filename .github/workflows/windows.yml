name: Evict Windows Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'win-v*', '!win-v*-beta*' ]
    paths: [ 'windows/**', 'scripts/**', '.github/release-policy.json', '.github/workflows/windows.yml' ]
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened, edited, labeled, unlabeled ]
    paths: [ 'windows/**', 'scripts/**', '.github/release-policy.json', '.github/workflows/windows.yml' ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

# Serialize beta planning through publication across ALL PRs so that the next
# three-digit beta tag cannot be allocated twice by concurrent pull requests.
concurrency:
  group: ${{ github.event_name == 'pull_request' && 'evict-beta' || 'evict-stable' }}
  cancel-in-progress: false
  queue: max

jobs:
  build:
    # Windows metadata is planned independently; PR code builds in a read-only job below.
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/win-v'))
    runs-on: windows-latest
    permissions:
      contents: write
      pull-requests: read
    outputs:
      version: ${{ steps.ver.outputs.version }}
      core_version: ${{ steps.ver.outputs.core_version }}
      source_sha: ${{ steps.ver.outputs.source_sha }}
      artifact: ${{ steps.ver.outputs.artifact }}
      publish: ${{ steps.ver.outputs.publish }}
      channel: ${{ steps.ver.outputs.channel }}
      prerelease: ${{ steps.ver.outputs.prerelease }}
      beta_tag_source: ${{ steps.ver.outputs.beta_tag_source }}
    defaults:
      run:
        working-directory: windows
    env:
      # Optional Authenticode signing – both steps below are skipped while these secrets are empty.
      # SIGN_PFX_BASE64: base64 of a .pfx code-signing certificate, SIGN_PFX_PASSWORD: its password.
      SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
      SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
    steps: &windows_build_steps
      - name: Authorize main source before executing repository code
        id: authorize
        if: github.event_name != 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            if (!['push', 'workflow_dispatch'].includes(context.eventName)) throw new Error('Unexpected stable build event.');
            const {data: main} = await github.rest.git.getRef({...context.repo, ref: 'heads/main'});
            let source;
            if (context.ref === 'refs/heads/main') {
              source = main.object.sha;
            } else {
              const match = context.ref.match(/^refs\/tags\/(win-v(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*))$/);
              if (!match || match[1] === 'win-v1.10.0') throw new Error('Only normal main release tags may execute in the stable build.');
              let target = (await github.rest.git.getRef({...context.repo, ref: 'tags/' + match[1]})).data.object;
              while (target.type === 'tag') target = (await github.rest.git.getTag({...context.repo, tag_sha: target.sha})).data.object;
              if (target.type !== 'commit') throw new Error('The stable tag does not identify a commit.');
              source = target.sha;
              const {data: comparison} = await github.rest.repos.compareCommits({...context.repo, base: source, head: main.object.sha});
              if (!['ahead', 'identical'].includes(comparison.status)) throw new Error('The stable tag source must be part of main.');
            }
            if (!/^[a-f0-9]{40}$/.test(source)) throw new Error('Invalid authorized main source identity.');
            core.setOutput('source_sha', source);
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # tags, to tell whether this version is already released
          # PR betas test the exact source snapshot that will be tagged, never GitHub's synthetic merge commit.
          ref: ${{ needs.freeze-beta.outputs.source_sha || steps.authorize.outputs.source_sha || github.event.pull_request.head.sha || github.sha }}

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Fetch immutable historical review proof
        working-directory: .
        run: git fetch origin 89877b5a3a193c27dde216be345f96c5e76544e2 --no-tags

      - name: Semantic version engine tests
        id: engine_tests
        working-directory: .
        shell: pwsh
        env:
          PYTHONUTF8: "1"
        run: |
          python -m unittest discover -s scripts/tests -v
          if ($LASTEXITCODE -ne 0) { throw "Semantic version engine tests failed" }
          $source = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { throw "Could not record the tested engine source" }
          "source_sha=$source" >> $env:GITHUB_OUTPUT

      - name: Plan version and synchronize stable source
        id: ver
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repoRoot = (Resolve-Path ..).Path
          $output = Join-Path $env:RUNNER_TEMP "windows-version-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT.txt"
          $ref = $env:GITHUB_REF
          $event = $env:GITHUB_EVENT_NAME
          $isMain = $ref -eq "refs/heads/main" -and $event -in @("push", "workflow_dispatch")
          $isTag = $ref.StartsWith("refs/tags/win-v")
          $tagName = if ($isTag) { $ref.Substring('refs/tags/'.Length) } else { '' }
          if ($isTag -and $tagName -eq 'win-v1.10.0') { throw 'The retired PR stable-test tag cannot be released from main' }
          $mode = if ($event -eq "pull_request") { "beta" } elseif ($isTag) { "tag" } else { "stable" }
          $allowed = @("windows/Directory.Build.props", "windows/installer/Evict.iss", "windows/CHANGELOG.md")

          function Read-Plan([bool] $sync) {
            $engineSource = (git -C $repoRoot rev-parse HEAD).Trim()
            if ($LASTEXITCODE -ne 0) { throw "Could not identify the version planner source" }
            if ($engineSource -ne "${{ steps.engine_tests.outputs.source_sha }}") {
              # A newer main/CAS retry must test the engine that actually makes this plan.
              $env:PYTHONUTF8 = "1"
              Push-Location -LiteralPath $repoRoot
              try {
                & python -m unittest discover -s scripts/tests -v | ForEach-Object { Write-Host $_ }
                if ($LASTEXITCODE -ne 0) { throw "Updated semantic version engine tests failed" }
              }
              finally { Pop-Location }
            }
            Set-Content -LiteralPath $output -Value "" -NoNewline -Encoding utf8
            $planArguments = @("$repoRoot/scripts/versioning.py", "plan", "--platform", "windows", "--mode", $mode,
              "--event-file", $env:GITHUB_EVENT_PATH, "--ref", $ref, "--repo-root", $repoRoot,
              "--main-ref", "origin/main", "--github-output", $output)
            # BT2: a publishing beta uses the number reserve-beta reserved as its tag; other PR builds preview the next one.
            if ($mode -eq "beta" -and '${{ needs.reserve-beta.outputs.beta_number }}' -ne '') { $planArguments += @("--beta-number", '${{ needs.reserve-beta.outputs.beta_number }}') }
            if ($mode -eq "tag") { $planArguments += @("--tag", $ref.Substring("refs/tags/".Length)) }
            if ($sync) { $planArguments += "--sync" }
            & python @planArguments | ForEach-Object { Write-Host $_ }
            if ($LASTEXITCODE -ne 0) { throw "Semantic version planning failed" }
            $result = @{}
            foreach ($line in Get-Content -LiteralPath $output -Encoding utf8) {
              if ($line -match '^([^=]+)=(.*)$') { $result[$Matches[1]] = $Matches[2] }
            }
            if ($result.core_version -notmatch '^\d+\.\d+\.\d+$' -or
                $result.version -notmatch '^\d+\.\d+\.\d+(?:-beta(?!000)\d{3})?$' -or
                $result.numeric_version -ne "$($result.core_version).0" -or
                $result.tag -ne "win-v$($result.version)" -or $result.publish -notin @("true", "false")) {
              throw "Invalid semantic version plan"
            }
            if ($mode -eq "beta" -and ($result.channel -ne "beta" -or $result.prerelease -ne "true" -or
                $result.version -notmatch '^\d+\.\d+\.\d+-beta(?!000)\d{3}$')) {
              throw "Every PR release must be a beta"
            }
            return $result
          }

          if ($isMain) {
            git -C $repoRoot config user.name "github-actions[bot]"
            git -C $repoRoot config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              git -C $repoRoot fetch origin "refs/heads/main:refs/remotes/origin/main" --tags
              if ($LASTEXITCODE -ne 0) { throw "Could not refresh main and release tags" }
              # Native Mac metadata is owned by the independent macOS pipeline.
              # This is the isolated runner checkout. Discard only the previous attempt's generated reservation.
              git -C $repoRoot checkout --detach --force origin/main
              if ($LASTEXITCODE -ne 0) { throw "Could not checkout current main" }
              $plan = Read-Plan $true
              $syncFiles = @($plan.sync_files | ConvertFrom-Json)
              if ($syncFiles | Where-Object { $_ -isnot [string] -or $_ -notin $allowed }) {
                throw "Version planner requested a file outside its managed allowlist"
              }
              $changed = @(git -C $repoRoot diff --name-only HEAD)
              if ($LASTEXITCODE -ne 0) { throw "Could not inspect generated version changes" }
              if ($changed | Where-Object { $_ -notin $allowed -or $_ -notin $syncFiles }) {
                throw "Version synchronization changed an unlisted file"
              }
              if ($changed.Count -gt 0) {
                git -C $repoRoot add -- @syncFiles
                if ($LASTEXITCODE -ne 0) { throw "Could not stage managed version files" }
                git -C $repoRoot commit -m "chore(release): windows $($plan.core_version)"
                if ($LASTEXITCODE -ne 0) { throw "Could not commit synchronized version files" }
                git -C $repoRoot push origin "HEAD:refs/heads/main"
                if ($LASTEXITCODE -ne 0) {
                  if ($attempt -eq 3) { throw "Main changed or rejected the version commit after three attempts; no release will be published" }
                  Write-Host "Main changed; recomputing the version from fresh source (attempt $($attempt + 1))."
                  continue
                }
                git -C $repoRoot fetch origin 'refs/heads/main:refs/remotes/origin/main' --tags
                if ($LASTEXITCODE -ne 0) { throw 'Could not confirm the updated main release source' }
              }
              break
            }
          }
          else { $plan = Read-Plan $false }
          if ($null -ne $plan) {
            # A beta is published only on its reserved tag; a PR build without a reservation is validation only.
            $plan.beta_tag_source = if ($mode -eq 'beta') { '${{ needs.reserve-beta.outputs.source_sha }}' } else { '' }
            if ($mode -eq 'beta' -and ($plan.beta_reserved -ne 'true' -or $plan.beta_tag_source -notmatch '^[a-f0-9]{40}$')) {
              $plan.publish = 'false'; $plan.beta_tag_source = ''
            }
          }

          function Read-Release([string] $tag) {
            $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json"; "X-GitHub-Api-Version" = "2022-11-28" }
            try { return Invoke-RestMethod -Uri "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" -Headers $headers }
            catch { if ([int]$_.Exception.Response.StatusCode -eq 404) { return $null }; throw }
          }

          $eligible = $isMain -or $isTag
          if (-not $eligible -and $mode -ne "beta") {
            # A branch dispatch is CI only and leaves source versions untouched.
            $core = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version
            $plan.version = $core; $plan.core_version = $core; $plan.numeric_version = "$core.0"; $plan.tag = "win-v$core"
          }
          $tagRef = "refs/tags/$($plan.tag)"
          $tagSource = git -C $repoRoot rev-parse -q --verify "$tagRef^{commit}" 2>$null
          $tagExists = $LASTEXITCODE -eq 0
          $global:LASTEXITCODE = 0
          $source = (git -C $repoRoot rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { throw "Could not read the checked-out source commit" }
          $release = if ($eligible) { Read-Release $plan.tag } else { $null }
          if ($tagExists) {
            $tagSource = $tagSource.Trim()
            # A reserved beta tag identifies the reviewed PR source; the build adds only managed version metadata on top.
            $expectedTagSource = if ($mode -eq 'beta') { $plan.beta_tag_source } else { $source }
            if ($plan.publish -eq "true" -and $tagSource -ne $expectedTagSource) { throw "Version tag already points to different source; refusing to change it" }
            if ($eligible -and ($null -eq $release -or $release.draft)) {
              # Resume a reserved tag from its frozen source, even if newer documentation/Mac changes exist on main.
              git -C $repoRoot checkout --detach $tagSource
              if ($LASTEXITCODE -ne 0) { throw "Could not checkout the reserved release source" }
              $source = $tagSource
              $plan.publish = "true"
            }
            elseif ($null -ne $release -and -not $release.draft) { $plan.publish = "false" }
          }
          elseif ($null -ne $release) { throw "A release exists without its source tag; refusing to replace its provenance" }
          if (-not $eligible -and $mode -ne "beta") { $plan.publish = "false" }
          if ($eligible -and $plan.publish -eq "true") {
            $stored = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version
            if ($stored -ne $plan.core_version) { throw "Release source version does not match the planned tag" }
          }
          $plan.source_sha = $source
          if ($mode -eq 'beta' -and '${{ needs.freeze-beta.outputs.source_sha }}' -ne '' -and
              ($source -ne '${{ needs.freeze-beta.outputs.source_sha }}' -or $plan.version -ne '${{ needs.reserve-beta.outputs.version }}')) {
            throw 'The frozen beta source or planned version changed before the build'
          }
          $plan.artifact = "Evict-$($plan.version)-$source"
          foreach ($key in $plan.Keys) { "$key=$($plan[$key])" >> $env:GITHUB_OUTPUT }
          Write-Host "Version $($plan.version), source $source, publish $($plan.publish)"

      - name: Feature list check
        working-directory: .
        env:
          PYTHONUTF8: "1"
        run: python scripts/features_check.py --version "${{ steps.ver.outputs.core_version }}"

      - name: Release plan
        id: rel
        shell: pwsh
        run: |
          "tag=${{ steps.ver.outputs.tag }}" >> $env:GITHUB_OUTPUT
          $publish = if ($env:GITHUB_EVENT_NAME -eq "pull_request") { "false" } else { "${{ steps.ver.outputs.publish }}" }
          "publish=$publish" >> $env:GITHUB_OUTPUT

      - name: Compile installer script early
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y | Out-Null }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found" }
          $dummySource = Join-Path $env:RUNNER_TEMP "evict-compile-source-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $dummyOutput = Join-Path $env:RUNNER_TEMP "evict-compile-output-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          New-Item -ItemType Directory -Path $dummySource, $dummyOutput -Force | Out-Null
          [IO.File]::WriteAllBytes((Join-Path $dummySource "Evict.exe"), [byte[]](0, 0, 0, 0))
          & $iscc "/DMyAppVersion=${{ steps.ver.outputs.version }}" "/DMyAppNumericVersion=${{ steps.ver.outputs.numeric_version }}" "/DSourceDir=$dummySource" "/O$dummyOutput" installer\Evict.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer script compilation failed with exit code $LASTEXITCODE" }

      - name: Restore
        run: dotnet restore Evict.sln

      - name: Unit tests
        run: dotnet test tests/Evict.Core.Tests/Evict.Core.Tests.csproj -c Release --no-restore -p:Version=${{ steps.ver.outputs.version }} -p:InformationalVersion=${{ steps.ver.outputs.version }} --logger "trx;LogFileName=tests.trx"

      - name: XAML sanity checks
        env:
          PYTHONUTF8: "1"
        run: python build/xaml_check.py

      - name: Publish single-file EXE
        shell: pwsh
        env:
          # Shown in the app's Info window (This build). Local builds leave these empty ("Local build").
          BUILD_SOURCE_PR: ${{ github.event.pull_request.number }}
          BUILD_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || steps.ver.outputs.source_sha }}
          BUILD_RELEASE_TAG: ${{ steps.ver.outputs.publish == 'true' && steps.ver.outputs.tag || '' }}
        run: |
          $builtUtc = [DateTime]::UtcNow.ToString("yyyy-MM-ddTHH:mm:ssZ", [Globalization.CultureInfo]::InvariantCulture)
          if ($env:BUILD_SOURCE_PR -notmatch '^\d*$' -or $env:BUILD_SOURCE_COMMIT -notmatch '^[a-f0-9]{40}$' -or
              $env:BUILD_RELEASE_TAG -notmatch '^(win-v[0-9A-Za-z.-]+)?$') { throw 'Invalid build metadata' }
          dotnet publish src/Evict.App/Evict.App.csproj -c Release -o Portable -p:Version=${{ steps.ver.outputs.version }} -p:InformationalVersion=${{ steps.ver.outputs.version }} `
            "-p:SourcePr=$env:BUILD_SOURCE_PR" "-p:SourceCommit=$env:BUILD_SOURCE_COMMIT" "-p:BuildTimeUtc=$builtUtc" "-p:ReleaseTag=$env:BUILD_RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed with exit code $LASTEXITCODE" }

      - name: Sign Evict.exe (optional)
        if: env.SIGN_PFX_BASE64 != ''
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\sign.pfx", [Convert]::FromBase64String($env:SIGN_PFX_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          & $signtool.FullName sign /f "$env:RUNNER_TEMP\sign.pfx" /p $env:SIGN_PFX_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 Portable\Evict.exe
          Remove-Item "$env:RUNNER_TEMP\sign.pfx" -Force

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y | Out-Null }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found" }
          & $iscc "/DMyAppVersion=${{ steps.ver.outputs.version }}" "/DMyAppNumericVersion=${{ steps.ver.outputs.numeric_version }}" "/DSourceDir=$PWD\Portable" installer\Evict.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
          Get-ChildItem Installed

      - name: Native installer smoke tests
        shell: pwsh
        run: |
          pwsh -NoProfile -File build/installer_smoke.ps1 -SetupPath "Installed/Evict-Setup-${{ steps.ver.outputs.version }}.exe" -PackagedExe "Portable/Evict.exe"
          if ($LASTEXITCODE -ne 0) { throw "Native installer smoke tests failed with exit code $LASTEXITCODE" }

      - name: Sign installer (optional)
        if: env.SIGN_PFX_BASE64 != ''
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\sign.pfx", [Convert]::FromBase64String($env:SIGN_PFX_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          Get-ChildItem Installed\*.exe | ForEach-Object { & $signtool.FullName sign /f "$env:RUNNER_TEMP\sign.pfx" /p $env:SIGN_PFX_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $_.FullName }
          Remove-Item "$env:RUNNER_TEMP\sign.pfx" -Force

      - name: Checksums
        shell: pwsh
        run: |
          (Get-FileHash Portable/Evict.exe -Algorithm SHA256).Hash | Out-File Portable/Evict.exe.sha256 -Encoding ascii
          Get-ChildItem Installed\*.exe | ForEach-Object { (Get-FileHash $_.FullName -Algorithm SHA256).Hash | Out-File "$($_.FullName).sha256" -Encoding ascii }


      - name: Stage native Windows build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path CiWindows/portable, CiWindows/windows-installer -Force | Out-Null
          Copy-Item -LiteralPath Portable/Evict.exe, Portable/Evict.exe.sha256 -Destination CiWindows/portable
          Copy-Item -LiteralPath "Installed/Evict-Setup-${{ steps.ver.outputs.version }}.exe", "Installed/Evict-Setup-${{ steps.ver.outputs.version }}.exe.sha256" -Destination CiWindows/windows-installer
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.ver.outputs.artifact }}-windows
          path: windows/CiWindows/
          if-no-files-found: error
          retention-days: 1

  # One-time correction of the explicitly requested stable PR test. Its tag and bytes remain immutable.
  retire-stable-pr-test:
    if: ${{ github.event_name == 'pull_request' && github.repository == 'krishnabhunia/evict-uninstaller' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.type == 'User' && github.event.sender.type == 'User' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: evict-retire-stable-pr-test-1.10.0
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request;
            const {data: live} = await github.rest.pulls.get({...context.repo, pull_number: pr.number});
            if (context.repo.owner !== 'krishnabhunia' || context.repo.repo !== 'evict-uninstaller' ||
                pr.head.repo.full_name !== process.env.GITHUB_REPOSITORY ||
                pr.base.repo.full_name !== process.env.GITHUB_REPOSITORY || pr.base.ref !== 'main' ||
                pr.user.type !== 'User' || context.payload.sender?.type !== 'User' ||
                /\[bot\]$/.test(pr.user.login) || /\[bot\]$/.test(context.payload.sender.login) ||
                live.state !== 'open' || live.head.sha !== pr.head.sha || live.base.ref !== 'main') {
              throw new Error('The historical release correction requires the current trusted PR.');
            }
            const source = 'cd62afeedd2838cfa1dda814ed8c6b9369e794ed';
            const release_id = 405730452;
            const {data: release} = await github.rest.repos.getRelease({...context.repo, release_id});
            const marker = 'Evict retired stable reservation: windows 1.10.0';
            const originalBody = "Explicit installed-update release test of [PR #12](https://github.com/krishnabhunia/evict-uninstaller/pull/12).\nRelease channel: stable\nRelease-test request: true\nOriginal PR head: 89877b5a3a193c27dde216be345f96c5e76544e2\nBuilt and tested release source: cd62afeedd2838cfa1dda814ed8c6b9369e794ed\nAll application, test and documentation files match the PR head. Only .github/workflows matches the default branch so GitHub Actions can publish without an additional token.\nThe release ZIP contains only installer/ and portable/, each with its SHA-256 checksum.\n";
            const expectedBody = originalBody + marker + '\n';
            if (release.tag_name !== 'win-v1.10.0' || release.target_commitish !== source ||
                release.prerelease || ![originalBody, expectedBody].includes(release.body)) {
              throw new Error('The historical release no longer has its exact reviewed provenance.');
            }
            let target = (await github.rest.git.getRef({...context.repo, ref: 'tags/win-v1.10.0'})).data.object;
            while (target.type === 'tag') target = (await github.rest.git.getTag({...context.repo, tag_sha: target.sha})).data.object;
            if (target.type !== 'commit' || target.sha !== source) throw new Error('The historical tag changed.');
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {...context.repo, release_id, per_page: 100});
            const expected = [{"id":618609321,"name":"Evict-1.10.0.zip","size":122511748,"digest":"sha256:ae1dfa5265fe46afe3758ebb69ad5dc68038f814b6155d058fda0d2fdb892dc1"},{"id":618609318,"name":"Evict-1.10.0.zip.sha256","size":65,"digest":"sha256:edd82beb000c1cc08a0494c3b5597e3fd43cac23dbc432d3be67654240bfab0b"},{"id":618609327,"name":"Evict-Setup-1.10.0.exe","size":61849338,"digest":"sha256:d1b8e82daf463886392ce674e24c566a8c72b8018041e8de4526bae2dbd45c28"},{"id":618609319,"name":"Evict-Setup-1.10.0.exe.sha256","size":66,"digest":"sha256:9c2e59a7841c8f8c9f3585a4d69ef0609418fa084b28a0af5c908fedb8dcd9c1"},{"id":618609320,"name":"Evict.exe","size":66763160,"digest":"sha256:3a39f1756d2fe8de9dd01b6a2607c60d198a7883ded9618a98e308ae08fa2073"},{"id":618609322,"name":"Evict.exe.sha256","size":66,"digest":"sha256:5631728c5ad985adec7807820811e5108f214a0dd97b2a82752501c41c3caf0b"}];
            const identity = assets.map(({id, name, size, digest}) => ({id, name, size, digest})).sort((a,b) => a.name.localeCompare(b.name));
            if (JSON.stringify(identity) !== JSON.stringify(expected) || assets.some(a => a.state !== 'uploaded' || a.size <= 0)) {
              throw new Error('Historical release asset identities or hashes changed.');
            }
            if (release.draft) {
              if (release.body !== expectedBody) throw new Error('Unexpected historical draft without its retirement marker.');
              core.info('The historical stable PR test is already retired; its tag and assets are unchanged.');
              return;
            }
            const crypto = require('crypto');
            for (const asset of assets) {
              const url = new URL(asset.browser_download_url);
              if (url.origin !== 'https://github.com' ||
                  url.pathname !== '/krishnabhunia/evict-uninstaller/releases/download/win-v1.10.0/' + asset.name) {
                throw new Error('Unexpected historical asset download URL.');
              }
              const response = await fetch(url, {signal: AbortSignal.timeout(180000)});
              if (!response.ok) throw new Error('Could not verify historical asset bytes: ' + asset.name);
              const hash = crypto.createHash('sha256'); let size = 0;
              for await (const chunk of response.body) { hash.update(chunk); size += chunk.length; }
              if (size !== asset.size || 'sha256:' + hash.digest('hex') !== asset.digest) {
                throw new Error('Historical release bytes disagree with their immutable hashes.');
              }
            }
            const {data: updated} = await github.rest.repos.updateRelease({
              ...context.repo, release_id, body: expectedBody, draft: true, prerelease: false, make_latest: 'false'
            });
            if (!updated.draft || updated.prerelease || updated.body !== expectedBody) throw new Error('Retirement was not confirmed.');
            core.info('Retired the stable PR test. Its source tag and all six assets remain unchanged.');

  prepare-beta:
    needs: retire-stable-pr-test
    if: always() && (needs.retire-stable-pr-test.result == 'success' || needs.retire-stable-pr-test.result == 'skipped') && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.repo.full_name == github.repository && github.event.pull_request.user.type == 'User' && github.event.sender.type == 'User' && github.actor != 'dependabot[bot]' && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      source_sha: ${{ steps.snapshot.outputs.source_sha }}
      temp_ref: ${{ steps.snapshot.outputs.temp_ref }}
    steps:
      - name: Prepare beta source without workflow changes
        id: snapshot
        uses: actions/github-script@v9
        with:
          script: |
            const repo = context.repo;
            const pr = context.payload.pull_request;
            const {data: current} = await github.rest.pulls.get({...repo, pull_number: pr.number});
            if (current.state !== 'open' || current.head.sha !== pr.head.sha || pr.base.ref !== 'main' ||
                pr.base.repo.full_name !== process.env.GITHUB_REPOSITORY || pr.user.type !== 'User' ||
                context.payload.sender?.type !== 'User' || /\[bot\]$/.test(pr.user.login) ||
                /\[bot\]$/.test(context.payload.sender.login)) throw new Error('A current same-repository human PR is required.');
            if (!pr || pr.head.repo.full_name !== process.env.GITHUB_REPOSITORY ||
                context.actor === 'dependabot[bot]' || pr.user.login === 'dependabot[bot]') {
              throw new Error('Only trusted same-repository PRs can prepare beta sources.');
            }
            const {data: metadata} = await github.rest.repos.get(repo);
            const {data: baseRef} = await github.rest.git.getRef({...repo, ref: 'heads/' + metadata.default_branch});
            const {data: base} = await github.rest.git.getCommit({...repo, commit_sha: baseRef.object.sha});
            const {data: head} = await github.rest.git.getCommit({...repo, commit_sha: pr.head.sha});
            async function workflows(treeSha) {
              const {data: root} = await github.rest.git.getTree({...repo, tree_sha: treeSha});
              const gh = root.tree.find(entry => entry.path === '.github' && entry.type === 'tree');
              if (!gh) return null;
              const {data: config} = await github.rest.git.getTree({...repo, tree_sha: gh.sha});
              return config.tree.find(entry => entry.path === 'workflows' && entry.type === 'tree')?.sha ?? null;
            }
            const defaultWorkflows = await workflows(base.tree.sha);
            if (await workflows(head.tree.sha) === defaultWorkflows) {
              core.setOutput('source_sha', head.sha);
              core.setOutput('temp_ref', '');
              return;
            }
            const {data: tree} = await github.rest.git.createTree({
              ...repo, base_tree: head.tree.sha,
              tree: [{path: '.github/workflows', mode: '040000', type: 'tree', sha: defaultWorkflows}]
            });
            async function applicationEntries(treeSha) {
              const {data: result} = await github.rest.git.getTree({...repo, tree_sha: treeSha, recursive: 'true'});
              if (result.truncated) throw new Error('Cannot verify a truncated source tree.');
              return result.tree
                .filter(entry => entry.path !== '.github' && entry.path !== '.github/workflows' &&
                                 !entry.path.startsWith('.github/workflows/'))
                .map(({path, mode, type, sha}) => ({path, mode, type, sha}))
                .sort((a, b) => a.path.localeCompare(b.path));
            }
            if (JSON.stringify(await applicationEntries(head.tree.sha)) !==
                JSON.stringify(await applicationEntries(tree.sha)) ||
                await workflows(tree.sha) !== defaultWorkflows) {
              throw new Error('Beta snapshot changed files outside the workflow subtree.');
            }
            // Same PR head + same main = the same snapshot SHA (author/committer copied from the PR head), so a
            // re-run finds the beta tag it reserved before and keeps its number (BT2).
            const {data: snapshot} = await github.rest.git.createCommit({
              ...repo, tree: tree.sha, parents: [base.sha],
              author: {name: head.author.name, email: head.author.email, date: head.author.date},
              committer: {name: head.committer.name, email: head.committer.email, date: head.committer.date},
              message: 'Windows beta source for PR #' + pr.number + '\n\nOriginal PR head: ' + head.sha +
                       '\nApplication, tests and documentation match the PR exactly. Workflows match default branch ' + base.sha + '.'
            });
            const ref = 'heads/beta-build/pr-' + pr.number + '/run-' + context.runId + '-attempt-' + process.env.GITHUB_RUN_ATTEMPT;
            await github.rest.git.createRef({...repo, ref: 'refs/' + ref, sha: snapshot.sha});
            core.setOutput('source_sha', snapshot.sha);
            core.setOutput('temp_ref', ref);
            await core.summary.addHeading('Windows beta source')
              .addRaw('Original PR head: ' + head.sha + '\n\nRelease source snapshot: ' + snapshot.sha +
                      '\n\nAll non-workflow tree entries verified identical.').write();

  # Execute the reviewed version engine with read-only credentials; generated metadata is transferred as data.
  plan-beta:
    needs: prepare-beta
    if: always() && needs.prepare-beta.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      core_version: ${{ steps.plan.outputs.core_version }}
      publish: ${{ steps.plan.outputs.publish }}
      pr_bump: ${{ steps.plan.outputs.pr_bump }}
      manifest_artifact: ${{ steps.plan.outputs.manifest_artifact }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare-beta.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Fetch immutable historical review proof
        run: git fetch origin 89877b5a3a193c27dde216be345f96c5e76544e2 --no-tags
      - name: Test version engine before generation
        run: python -m unittest discover -s scripts/tests -v
      - name: Calculate beta and export only managed metadata
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          PREPARED_SOURCE: ${{ needs.prepare-beta.outputs.source_sha }}
        run: |
          set -euo pipefail
          mkdir GeneratedVersion
          # The core is planned here; reserve-beta then reserves the real three-digit number as a tag (BT2).
          python scripts/versioning.py plan --platform windows --mode beta --sync \
            --event-file "$GITHUB_EVENT_PATH" --ref "$GITHUB_REF" --main-ref origin/main \
            --github-output "$GITHUB_OUTPUT" > "$RUNNER_TEMP/beta-plan.json"
          python - <<'PY'
          import json, os, pathlib, subprocess
          allowed = ["windows/Directory.Build.props", "windows/installer/Evict.iss", "windows/CHANGELOG.md"]
          plan = json.loads(pathlib.Path(os.environ["RUNNER_TEMP"], "beta-plan.json").read_text())
          changed = subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()
          assert all(path in allowed for path in changed), "Generated changes escaped the version allowlist"
          assert all(path in allowed for path in plan["sync_files"]), "Unexpected generated path"
          assert plan["channel"] == "beta" and plan["prerelease"] is True
          assert plan["source_sha"] == os.environ["PREPARED_SOURCE"]
          assert not plan["publish"] or plan["source_version"] == plan["core_version"]
          manifest = {"source_sha": os.environ["PREPARED_SOURCE"], "plan": plan,
                      "files": {path: pathlib.Path(path).read_text(encoding="utf-8-sig") for path in allowed}}
          pathlib.Path("GeneratedVersion/manifest.json").write_text(json.dumps(manifest), encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"manifest_artifact=generated-windows-version-{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}\n")
          PY
      - name: A feature PR updates docs/FEATURES.md
        env:
          PYTHONUTF8: "1"
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BUMP: ${{ steps.plan.outputs.pr_bump }}
          CORE_VERSION: ${{ steps.plan.outputs.core_version }}
        run: |
          set -euo pipefail
          git diff --name-only --no-renames "$(git merge-base "$PR_BASE" "$PR_HEAD")" "$PR_HEAD" -- > "$RUNNER_TEMP/pr-files.txt"
          python scripts/features_check.py --version "$CORE_VERSION" --bump "$PR_BUMP" --changed-files "$RUNNER_TEMP/pr-files.txt"
      - uses: actions/upload-artifact@v7
        id: version_manifest
        with:
          name: ${{ steps.plan.outputs.manifest_artifact }}
          path: GeneratedVersion/manifest.json
          if-no-files-found: error
          retention-days: 1

  # BT2: reserve the next short beta number for this core by creating its tag on the reviewed PR source.
  # Re-runs of the same source reuse their number; a number whose build fails later is skipped (gaps are fine).
  # Only scripts/beta_reservation.py (standard library, unit tested first) runs here; the token is not persisted.
  reserve-beta:
    needs: [prepare-beta, plan-beta]
    if: always() && needs.prepare-beta.result == 'success' && needs.plan-beta.result == 'success' && needs.plan-beta.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      beta_number: ${{ steps.reserve.outputs.beta_number }}
      version: ${{ steps.reserve.outputs.version }}
      tag: ${{ steps.reserve.outputs.tag }}
      source_sha: ${{ steps.reserve.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare-beta.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Test the reservation algorithm
        run: python -m unittest scripts/tests/test_beta_reservation.py -v
      - name: Reserve the beta number
        id: reserve
        env:
          GH_TOKEN: ${{ github.token }}
          CORE_VERSION: ${{ needs.plan-beta.outputs.core_version }}
          PREPARED_SOURCE: ${{ needs.prepare-beta.outputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PREPARED_SOURCE"
          python scripts/beta_reservation.py --repository "$GITHUB_REPOSITORY" --core "$CORE_VERSION" \
            --prefix win-v --sha "$PREPARED_SOURCE" --github-output "$GITHUB_OUTPUT" | tee "$RUNNER_TEMP/reservation.json"
          python - "$RUNNER_TEMP/reservation.json" <<'PY'
          import json, os, sys
          result = json.load(open(sys.argv[1]))
          line = f"Beta {result['version']} · tag {result['tag']} · {'reused' if result['reused'] else 'new'} · source {result['source_sha']}"
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("### Reserved beta number\n\n" + line + "\n")
          PY

  # This job reads a data manifest; it never checks out or executes PR code with a write token.
  freeze-beta:
    needs: [prepare-beta, plan-beta, reserve-beta]
    if: always() && needs.prepare-beta.result == 'success' && needs.plan-beta.result == 'success' && needs.plan-beta.outputs.publish == 'true' && needs.reserve-beta.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    outputs:
      source_sha: ${{ steps.freeze.outputs.source_sha }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.plan-beta.outputs.manifest_artifact }}
          path: GeneratedVersion
      - name: Validate generated metadata and freeze final source
        id: freeze
        uses: actions/github-script@v9
        env:
          PREPARED_SOURCE: ${{ needs.prepare-beta.outputs.source_sha }}
          PLANNED_VERSION: ${{ needs.plan-beta.outputs.version }}
          BETA_CORE: ${{ needs.plan-beta.outputs.core_version }}
          BETA_NUMBER: ${{ needs.reserve-beta.outputs.beta_number }}
          BETA_VERSION: ${{ needs.reserve-beta.outputs.version }}
          BETA_TAG: ${{ needs.reserve-beta.outputs.tag }}
          RESERVED_SOURCE: ${{ needs.reserve-beta.outputs.source_sha }}
        with:
          script: |
            const fs = require('fs');
            const pr = context.payload.pull_request;
            const {data: current} = await github.rest.pulls.get({...context.repo, pull_number: pr.number});
            if (current.state !== 'open' || current.head.sha !== pr.head.sha ||
                pr.head.repo.full_name !== process.env.GITHUB_REPOSITORY || pr.base.repo.full_name !== process.env.GITHUB_REPOSITORY ||
                pr.base.ref !== 'main' || pr.user.type !== 'User' || context.payload.sender?.type !== 'User' ||
                /\[bot\]$/.test(pr.user.login) || /\[bot\]$/.test(context.payload.sender.login)) {
              throw new Error('Only the current trusted same-repository human PR may freeze a beta.');
            }
            const path = 'GeneratedVersion/manifest.json';
            const stat = fs.lstatSync(path);
            if (!stat.isFile() || stat.isSymbolicLink() || stat.size > 1000000 ||
                JSON.stringify(fs.readdirSync('GeneratedVersion').sort()) !== JSON.stringify(['manifest.json'])) {
              throw new Error('Unexpected generated metadata artifact.');
            }
            const manifest = JSON.parse(fs.readFileSync(path, 'utf8'));
            const p = manifest.plan, coreVersion = process.env.BETA_CORE, number = process.env.BETA_NUMBER;
            // The plan only previewed a number; the number reserved as a tag by reserve-beta replaces it (BT1 A / BT2).
            const expectedVersion = coreVersion + '-beta' + number;
            const allowed = ['windows/Directory.Build.props', 'windows/installer/Evict.iss', 'windows/CHANGELOG.md'];
            if (!/^(?!000)\d{3}$/.test(number || '') || process.env.BETA_VERSION !== expectedVersion ||
                process.env.BETA_TAG !== 'win-v' + expectedVersion || process.env.RESERVED_SOURCE !== process.env.PREPARED_SOURCE) {
              throw new Error('The reserved beta number does not belong to this core and prepared source.');
            }
            let reserved = (await github.rest.git.getRef({...context.repo, ref: 'tags/' + process.env.BETA_TAG})).data.object;
            while (reserved.type === 'tag') reserved = (await github.rest.git.getTag({...context.repo, tag_sha: reserved.sha})).data.object;
            if (reserved.type !== 'commit' || reserved.sha !== process.env.PREPARED_SOURCE) {
              throw new Error('The reserved beta tag does not identify the prepared PR source.');
            }
            if (manifest.source_sha !== process.env.PREPARED_SOURCE || p.source_sha !== manifest.source_sha ||
                p.version !== process.env.PLANNED_VERSION || p.beta_reserved !== false ||
                !/^\d+\.\d+\.\d+-beta(?!000)\d{3}$/.test(p.version || '') ||
                !/^\d+\.\d+\.\d+-beta(?!000)\d{3}$/.test(expectedVersion) ||
                !/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(coreVersion) ||
                coreVersion.split('.').some(n => Number(n) > 65535) ||
                p.core_version !== coreVersion || p.source_version !== coreVersion ||
                p.numeric_version !== coreVersion + '.0' || p.channel !== 'beta' || p.prerelease !== true ||
                p.tag !== 'win-v' + p.version || !Array.isArray(p.sync_files) ||
                p.sync_files.some(path => !allowed.includes(path)) ||
                JSON.stringify(Object.keys(manifest.files).sort()) !== JSON.stringify([...allowed].sort()) ||
                !Array.isArray(p.notes) || p.notes.some(n => typeof n !== 'string' || n.length > 2000) ||
                !/^\d{4}-\d{2}-\d{2}$/.test(p.sync_date) ||
                Math.abs(Date.now() - Date.parse(p.sync_date + 'T00:00:00Z')) > 172800000) {
              throw new Error('Generated beta identity or metadata contract is invalid.');
            }
            const {data: source} = await github.rest.git.getCommit({...context.repo, commit_sha: manifest.source_sha});
            const {data: sourceTree} = await github.rest.git.getTree({...context.repo, tree_sha: source.tree.sha, recursive: 'true'});
            if (sourceTree.truncated) throw new Error('Cannot verify a truncated prepared source.');
            const generated = [];
            const normalize = text => text.replace(/^\uFEFF/, '').replace(/\r\n/g, '\n').replace(/\r/g, '\n');
            function changelog(text) {
              const marker = '<!-- Evict automatic release; base: ' + (p.base_tag || 'initial') + ' -->';
              const heading = /^## (.+)$/m.exec(text);
              if (heading) {
                const start = heading.index, headingEnd = start + heading[0].length;
                const next = /^## /m.exec(text.slice(headingEnd));
                const end = next ? headingEnd + next.index : text.length;
                const first = text.slice(headingEnd, end);
                const reusable = heading[1].toLowerCase().includes('not published') ||
                  heading[1].toLowerCase() === 'unreleased' || first.includes(marker);
                const same = heading[1] === coreVersion || heading[1].startsWith(coreVersion + ' ');
                if (reusable) {
                  let section = first.trim().replace(/^<!-- Evict automatic release; base: .* -->\n?/gm, '').trim();
                  for (const note of p.notes) {
                    const bullet = '- ' + note;
                    if (!section.includes(bullet)) section += (section ? '\n' : '') + bullet;
                  }
                  return text.slice(0, start) + '## ' + coreVersion + ' — ' + p.sync_date + '\n\n' +
                    marker + '\n\n' + section + '\n\n' + text.slice(end).replace(/^\n+/, '');
                }
                if (same) return text;
              }
              const bullets = p.notes.map(note => '- ' + note).join('\n') || '- Maintenance changes.';
              const section = '## ' + coreVersion + ' — ' + p.sync_date + '\n\n' + marker + '\n\n' + bullets + '\n\n';
              return heading ? text.slice(0, heading.index) + section + text.slice(heading.index) : text.trimEnd() + '\n\n' + section;
            }
            for (const path of allowed) {
              const entry = sourceTree.tree.find(e => e.path === path);
              if (!entry || entry.type !== 'blob' || entry.mode !== '100644') throw new Error('A managed source file is missing or unsafe.');
              const {data: blob} = await github.rest.git.getBlob({...context.repo, file_sha: entry.sha});
              const original = normalize(Buffer.from(blob.content, 'base64').toString('utf8'));
              let expected = original;
              if (path.endsWith('Directory.Build.props')) {
                if (!/<Version>\s*[^<]+\s*<\/Version>/.test(original)) throw new Error('Missing source Version.');
                expected = original.replace(/(<Version>)\s*[^<]+\s*(<\/Version>)/, '$1' + coreVersion + '$2');
              } else if (path.endsWith('Evict.iss')) {
                if (!/#define MyAppVersion "[^"]+"/.test(original)) throw new Error('Missing installer version.');
                expected = original.replace(/(#define MyAppVersion ")[^"]+(")/, '$1' + coreVersion + '$2')
                  .replace(/^(\s*#define MyAppNumericVersion )[^\r\n]+/m, '$1"' + coreVersion + '.0"')
                  .replace(/(\/DMyAppVersion=)[0-9]+\.[0-9]+\.[0-9]+/, '$1' + coreVersion);
              } else { expected = changelog(original); }
              if (manifest.files[path] !== expected) throw new Error('Noncanonical generated content: ' + path);
              const {data: created} = await github.rest.git.createBlob({...context.repo, content: expected, encoding: 'utf-8'});
              generated.push({path, mode: '100644', type: 'blob', sha: created.sha});
            }
            const {data: tree} = await github.rest.git.createTree({...context.repo, base_tree: source.tree.sha, tree: generated});
            const {data: finalTree} = await github.rest.git.getTree({...context.repo, tree_sha: tree.sha, recursive: 'true'});
            if (finalTree.truncated) throw new Error('Cannot verify a truncated frozen source.');
            const unchanged = result => result.tree.filter(e => e.type !== 'tree' && !allowed.includes(e.path))
              .map(({path, mode, type, sha}) => ({path, mode, type, sha})).sort((a,b) => a.path.localeCompare(b.path));
            if (JSON.stringify(unchanged(sourceTree)) !== JSON.stringify(unchanged(finalTree))) {
              throw new Error('Version freezing changed a file outside the exact metadata allowlist.');
            }
            // Deterministic like the prepared snapshot: a re-run of the same reserved beta rebuilds the same
            // frozen commit, so it re-verifies the release that an earlier attempt already published (BT2).
            const {data: commit} = await github.rest.git.createCommit({
              ...context.repo, tree: tree.sha, parents: [source.sha],
              author: {name: source.author.name, email: source.author.email, date: source.author.date},
              committer: {name: source.committer.name, email: source.committer.email, date: source.committer.date},
              message: 'Windows beta version ' + expectedVersion + ' for PR #' + pr.number +
                '\n\nOriginal PR head: ' + pr.head.sha + '\nGenerated core metadata only; all other prepared source entries preserved.'
            });
            const ref = 'heads/beta-versioned/pr-' + pr.number + '/run-' + context.runId + '-attempt-' + process.env.GITHUB_RUN_ATTEMPT;
            await github.rest.git.createRef({...context.repo, ref: 'refs/' + ref, sha: commit.sha});
            core.setOutput('source_sha', commit.sha);
            await core.summary.addHeading('Frozen beta ' + expectedVersion).addRaw('Exact source: ' + commit.sha).write();

  pr-build:
    needs: [freeze-beta, plan-beta, reserve-beta]
    if: always() && github.event_name == 'pull_request' && (needs.freeze-beta.result == 'success' || (needs.plan-beta.result == 'success' && needs.plan-beta.outputs.publish == 'false') || github.event.pull_request.head.repo.full_name != github.repository || github.actor == 'dependabot[bot]' || github.event.pull_request.user.login == 'dependabot[bot]' || github.event.pull_request.user.type != 'User' || github.event.sender.type != 'User')
    runs-on: windows-latest
    permissions:
      contents: read
      pull-requests: read
    defaults:
      run:
        working-directory: windows
    env:
      # Reviewed PR code receives read-only credentials and no signing secrets.
      SIGN_PFX_BASE64: ''
      SIGN_PFX_PASSWORD: ''
    outputs:
      version: ${{ steps.ver.outputs.version }}
      core_version: ${{ steps.ver.outputs.core_version }}
      channel: ${{ steps.ver.outputs.channel }}
      prerelease: ${{ steps.ver.outputs.prerelease }}
      source_sha: ${{ steps.ver.outputs.source_sha }}
      artifact: ${{ steps.ver.outputs.artifact }}
      publish: ${{ steps.ver.outputs.publish }}
      beta_tag_source: ${{ steps.ver.outputs.beta_tag_source }}
    steps: *windows_build_steps

  # Reuse a completed native release at the version in the frozen Windows source.
  # Windows changes never compile, sign, mount or launch a macOS app.
  mac-package:
    needs: [build, pr-build]
    if: always() && (needs.build.result == 'success' || needs.pr-build.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.bundle.outputs.version }}
      artifact: ${{ steps.bundle.outputs.artifact }}
      release_tag: ${{ steps.bundle.outputs.release_tag }}
      release_source: ${{ steps.bundle.outputs.release_source }}
      sha256: ${{ steps.bundle.outputs.sha256 }}
      verification_run_id: ${{ steps.bundle.outputs.verification_run_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.pr-build.outputs.source_sha || needs.build.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Reuse matching verified native macOS release
        id: bundle
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SOURCE: ${{ needs.pr-build.outputs.source_sha || needs.build.outputs.source_sha }}
          RELEASE_VERSION: ${{ needs.pr-build.outputs.version || needs.build.outputs.version }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          python scripts/fetch_macos_bundle.py --windows-version "$RELEASE_VERSION" \
            --source-sha "$EXPECTED_SOURCE" --out MacPackage --github-output "$GITHUB_OUTPUT" \
            --wait-seconds 1200
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.bundle.outputs.artifact }}
          path: MacPackage/
          if-no-files-found: error
          retention-days: 1

  package:
    needs: [build, pr-build, mac-package]
    if: always() && needs.mac-package.result == 'success' && (needs.build.result == 'success' || needs.pr-build.result == 'success')
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      version: ${{ needs.pr-build.outputs.version || needs.build.outputs.version }}
      core_version: ${{ needs.pr-build.outputs.core_version || needs.build.outputs.core_version }}
      source_sha: ${{ needs.pr-build.outputs.source_sha || needs.build.outputs.source_sha }}
      artifact: ${{ format('Evict_{0}', needs.pr-build.outputs.version || needs.build.outputs.version) }}
      artifact_id: ${{ steps.installation.outputs.artifact-id }}
      transport_artifact: ${{ needs.pr-build.outputs.artifact || needs.build.outputs.artifact }}
      publish: ${{ needs.pr-build.outputs.publish || needs.build.outputs.publish }}
      channel: ${{ needs.pr-build.outputs.channel || needs.build.outputs.channel }}
      prerelease: ${{ needs.pr-build.outputs.prerelease || needs.build.outputs.prerelease }}
      beta_tag_source: ${{ needs.pr-build.outputs.beta_tag_source || needs.build.outputs.beta_tag_source }}
      mac_version: ${{ needs.mac-package.outputs.version }}
      mac_artifact: ${{ needs.mac-package.outputs.artifact }}
      mac_release_tag: ${{ needs.mac-package.outputs.release_tag }}
      mac_release_source: ${{ needs.mac-package.outputs.release_source }}
      mac_sha256: ${{ needs.mac-package.outputs.sha256 }}
      mac_verification_run_id: ${{ needs.mac-package.outputs.verification_run_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.pr-build.outputs.source_sha || needs.build.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.pr-build.outputs.artifact || needs.build.outputs.artifact }}-windows
          path: windows/CiWindows
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.mac-package.outputs.artifact }}
          path: windows/MacPackage
      - name: Assemble the three-folder installation ZIP
        working-directory: windows
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.pr-build.outputs.version || needs.build.outputs.version }}
          MAC_VERSION: ${{ needs.mac-package.outputs.version }}
        run: |
          $nativeFiles = @("CiWindows/portable/Evict.exe", "CiWindows/windows-installer/Evict-Setup-$env:RELEASE_VERSION.exe",
            "MacPackage/Evict_$env:RELEASE_VERSION.dmg")
          foreach ($file in $nativeFiles) {
            $expected = (Get-Content -LiteralPath "$file.sha256" -Raw).Trim()
            if ($expected -notmatch '^[a-fA-F0-9]{64}$' -or
                (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash -ne $expected) {
              throw "Transferred native artifact checksum mismatch: $file"
            }
          }
          python build/release_zip.py $env:RELEASE_VERSION --setup CiWindows/windows-installer --exe CiWindows/portable --macos "MacPackage/Evict_$env:RELEASE_VERSION.dmg" --out Zip
          if ($LASTEXITCODE -ne 0) { throw 'The installation ZIP failed native artifact validation' }
          Expand-Archive -LiteralPath "Zip/Evict_$env:RELEASE_VERSION.zip" -DestinationPath CiDownload
          python build/release_zip.py --check-folder CiDownload
          if ($LASTEXITCODE -ne 0) { throw 'The installation ZIP must contain one versioned root with portable/windows-x64/macOS' }
      - name: Write source release notes
        working-directory: windows
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.pr-build.outputs.version || needs.build.outputs.version }}
          SOURCE_SHA: ${{ needs.pr-build.outputs.source_sha || needs.build.outputs.source_sha }}
          WILL_PUBLISH: ${{ needs.pr-build.outputs.publish || needs.build.outputs.publish }}
        run: |
          $coreVersion = $env:RELEASE_VERSION.Split('-')[0]
          $notes = @(); $inside = $false
          foreach ($line in Get-Content -LiteralPath CHANGELOG.md -Encoding utf8) {
            if ($line -match '^## ') {
              if ($inside) { break }
              $inside = $line -match ("^## " + [regex]::Escape($coreVersion) + "(?:\s|$)")
              continue
            }
            if ($inside) { $notes += $line }
          }
          if (-not $notes -and $env:WILL_PUBLISH -eq 'true') { throw 'The frozen source changelog is missing its version section' }
          if (-not $notes) { $notes = @('- Validation build; no release publication.') }
          ($notes -join [char]10).Trim() | Set-Content -LiteralPath Zip/release-notes.md -Encoding utf8
          if ($env:WILL_PUBLISH -eq 'true') {
            python ../scripts/release_notes_check.py Zip/release-notes.md
            if ($LASTEXITCODE -ne 0) { throw 'Release notes must identify the actual implementations' }
          }
      - uses: actions/upload-artifact@v7
        id: installation
        with:
          name: ${{ format('Evict_{0}', needs.pr-build.outputs.version || needs.build.outputs.version) }}
          path: windows/CiDownload/
          if-no-files-found: error
          overwrite: true
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.pr-build.outputs.artifact || needs.build.outputs.artifact }}-release-zip
          path: windows/Zip/
          if-no-files-found: error
          retention-days: 1

      - name: Installation download
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.pr-build.outputs.version || needs.build.outputs.version }}
          MAC_VERSION: ${{ needs.mac-package.outputs.version }}
          INSTALLATION_URL: ${{ steps.installation.outputs.artifact-url }}
        run: |
          @("### Installation download", "",
            "[Download Evict installation]($env:INSTALLATION_URL)", "",
            "Windows: $env:RELEASE_VERSION; macOS: $env:MAC_VERSION", "",
            "ZIP: Evict_$env:RELEASE_VERSION.zip", "",
            "Root: Evict_$env:RELEASE_VERSION/; contains portable/, windows-x64/ and macOS/.") |
            Out-File -LiteralPath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

  validate-dispatch:
    if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/win-v')
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Validate the version engine
        run: python -m unittest discover -s scripts/tests -v
      - name: Validate Windows application
        working-directory: windows
        run: dotnet test tests/Evict.Core.Tests/Evict.Core.Tests.csproj -c Release

  # Publication consumes validated files as data and executes no repository code with write credentials.
  publish:
    needs: package
    if: always() && needs.package.result == 'success' && needs.package.outputs.publish == 'true'
    runs-on: windows-latest
    permissions:
      contents: write
      pull-requests: read
      actions: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.package.outputs.artifact }}
          path: Download
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.package.outputs.transport_artifact }}-release-zip
          path: Zip
      - name: Verify native files and exact versioned installation layout
        id: assets
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.package.outputs.version }}
          MAC_VERSION: ${{ needs.package.outputs.mac_version }}
        run: |
          $v = $env:RELEASE_VERSION; $mac = $env:MAC_VERSION
          if ($v -notmatch '^\d+\.\d+\.\d+(?:-beta(?!000)\d{3})?$' -or $mac -notmatch '^\d+\.\d+\.\d+$') {
            throw 'Invalid release artifact identity'
          }
          $root = "Evict_$v"
          $expected = @("$root/portable/Evict_$v.exe", "$root/windows-x64/Evict_$v.exe",
            "$root/macOS/Evict_$v.dmg") | Sort-Object
          $actual = @(Get-ChildItem -LiteralPath Download -File -Recurse | ForEach-Object {
            [IO.Path]::GetRelativePath((Resolve-Path Download).Path, $_.FullName).Replace('\', '/')
          } | Sort-Object)
          $dirs = @(Get-ChildItem -LiteralPath Download -Directory)
          if ($dirs.Count -ne 1 -or $dirs[0].Name -cne $root -or $actual.Count -ne 3 -or
              ($actual -join [char]10) -cne ($expected -join [char]10)) {
            throw 'Installation artifact must contain one versioned root and exactly three native files'
          }
          $allItems = @(Get-ChildItem -LiteralPath Download -Recurse)
          if ($allItems.Where({ $_.LinkType }).Count -ne 0 -or
              $allItems.Where({ $_.PSIsContainer }).Count -ne 4) { throw 'Unexpected installation directories or links' }
          foreach ($path in $expected) {
            $file = Get-Item -LiteralPath (Join-Path Download $path)
            if ($file.Length -le 0) { throw "Empty native artifact: $path" }
          }
          $zipPath = "Zip/Evict_$v.zip"
          $expectedHash = (Get-Content -LiteralPath "$zipPath.sha256" -Raw).Trim()
          if ($expectedHash -notmatch '^[a-fA-F0-9]{64}$' -or
              (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash -ne $expectedHash) {
            throw 'Installation ZIP checksum mismatch'
          }
          $product = [Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path "Download/$root/portable/Evict_$v.exe").Path).ProductVersion -replace '\+.*$', ''
          if ($product -ne $v) { throw 'Native Windows executable version differs from its release identity' }
          $setup = [Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path "Download/$root/windows-x64/Evict_$v.exe").Path)
          if ("$($setup.FileMajorPart).$($setup.FileMinorPart).$($setup.FileBuildPart).$($setup.FilePrivatePart)" -ne "$($v.Split('-')[0]).0") {
            throw 'Native Windows installer numeric version differs from its core version'
          }
          $archive = [IO.Compression.ZipFile]::OpenRead((Resolve-Path -LiteralPath $zipPath).Path)
          try {
            $entries = @($archive.Entries | ForEach-Object { $_.FullName } | Sort-Object)
            if ($entries.Count -ne 3 -or ($entries -join [char]10) -cne ($expected -join [char]10)) {
              throw 'The ZIP must contain exactly the three versioned portable/windows-x64/macOS payloads'
            }
            foreach ($entry in $archive.Entries) {
              $stream = $entry.Open()
              try { $hash = (Get-FileHash -InputStream $stream -Algorithm SHA256).Hash }
              finally { $stream.Dispose() }
              if ($hash -ne (Get-FileHash -LiteralPath (Join-Path Download $entry.FullName) -Algorithm SHA256).Hash) {
                throw "The ZIP changed a validated native artifact: $($entry.FullName)"
              }
            }
          }
          finally { $archive.Dispose() }
          # Published updater aliases keep installed older Evict versions compatible.
          New-Item -ItemType Directory -Path ReleaseInputs -Force | Out-Null
          Copy-Item -LiteralPath "Download/$root/portable/Evict_$v.exe" -Destination ReleaseInputs/Evict.exe
          Copy-Item -LiteralPath "Download/$root/windows-x64/Evict_$v.exe" -Destination "ReleaseInputs/Evict-Setup-$v.exe"
          Copy-Item -LiteralPath "Download/$root/macOS/Evict_$v.dmg" -Destination "ReleaseInputs/Evict_$v.dmg"
          $sizes = @{}
          foreach ($file in @("ReleaseInputs/Evict.exe", "ReleaseInputs/Evict-Setup-$v.exe", "ReleaseInputs/Evict_$v.dmg", $zipPath)) {
            $item = Get-Item -LiteralPath $file
            if (-not $file.StartsWith('Zip/')) {
              (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash |
                Set-Content -LiteralPath "$file.sha256" -Encoding ascii
            }
            $sizes[$item.Name] = $item.Length
            $sizes[[IO.Path]::GetFileName("$file.sha256")] = (Get-Item -LiteralPath "$file.sha256").Length
          }
          "sizes=$($sizes | ConvertTo-Json -Compress)" >> $env:GITHUB_OUTPUT
          $macHash = (Get-FileHash -LiteralPath "ReleaseInputs/Evict_$v.dmg" -Algorithm SHA256).Hash.ToLowerInvariant()
          "mac_sha256=$macHash" >> $env:GITHUB_OUTPUT

      - name: Guard release channel, reviewed source and immutable tag
        id: guard
        uses: actions/github-script@v9
        env:
          RELEASE_VERSION: ${{ needs.package.outputs.version }}
          RELEASE_SOURCE: ${{ needs.package.outputs.source_sha }}
          RELEASE_CHANNEL: ${{ needs.package.outputs.channel }}
          RELEASE_PRERELEASE: ${{ needs.package.outputs.prerelease }}
          BETA_TAG_SOURCE: ${{ needs.package.outputs.beta_tag_source }}
          MAC_VERSION: ${{ needs.package.outputs.mac_version }}
          MAC_RELEASE_TAG: ${{ needs.package.outputs.mac_release_tag }}
          MAC_RELEASE_SOURCE: ${{ needs.package.outputs.mac_release_source }}
          MAC_VERIFICATION_RUN: ${{ needs.package.outputs.mac_verification_run_id }}
          MAC_SHA256: ${{ steps.assets.outputs.mac_sha256 }}
          ASSET_SIZES: ${{ steps.assets.outputs.sizes }}
        with:
          script: |
            const version = process.env.RELEASE_VERSION;
            const source = process.env.RELEASE_SOURCE;
            const tagSource = process.env.BETA_TAG_SOURCE;
            const isPr = context.eventName === 'pull_request';
            const prerelease = isPr;
            const pr = context.payload.pull_request;
            if (!/^[a-f0-9]{40}$/.test(source) ||
                process.env.RELEASE_CHANNEL !== (isPr ? 'beta' : 'stable') ||
                process.env.RELEASE_PRERELEASE !== String(prerelease)) throw new Error('Invalid source or release channel.');
            if (isPr) {
              const {data: current} = await github.rest.pulls.get({...context.repo, pull_number: pr.number});
              if (pr.head.repo.full_name !== process.env.GITHUB_REPOSITORY ||
                  pr.base.repo.full_name !== process.env.GITHUB_REPOSITORY || pr.base.ref !== 'main' ||
                  pr.user.type !== 'User' || context.payload.sender?.type !== 'User' ||
                  /\[bot\]$/.test(pr.user.login) || /\[bot\]$/.test(context.payload.sender.login) ||
                  current.state !== 'open' || current.head.sha !== pr.head.sha ||
                  !/^\d+\.\d+\.\d+-beta(?!000)\d{3}$/.test(version) || !/^[a-f0-9]{40}$/.test(tagSource || '')) {
                throw new Error('Every PR release must be a reserved beta of the current trusted reviewed head.');
              }
              // BT2: the reserved tag source is the PR head, or its snapshot with default-branch workflows.
              const {data: reservedCommit} = await github.rest.git.getCommit({...context.repo, commit_sha: tagSource});
              if (tagSource !== pr.head.sha &&
                  !reservedCommit.message.split(/\r?\n/).includes('Original PR head: ' + pr.head.sha)) {
                throw new Error('The reserved beta tag source is not this PR head.');
              }
              // The tested source is that commit plus only the three managed version files.
              const {data: frozen} = await github.rest.git.getCommit({...context.repo, commit_sha: source});
              const {data: delta} = await github.rest.repos.compareCommits({...context.repo, base: tagSource, head: source});
              const managed = ['windows/Directory.Build.props', 'windows/installer/Evict.iss', 'windows/CHANGELOG.md'];
              if (frozen.parents.length !== 1 || frozen.parents[0].sha !== tagSource || delta.status !== 'ahead' ||
                  delta.ahead_by !== 1 || (delta.files || []).some(f => !managed.includes(f.filename) || f.status !== 'modified')) {
                throw new Error('The tested beta source differs from its reserved PR source beyond managed version metadata.');
              }
            } else {
              if (!/^\d+\.\d+\.\d+$/.test(version) ||
                  !['push', 'workflow_dispatch'].includes(context.eventName) ||
                  !(context.ref === 'refs/heads/main' || context.ref === 'refs/tags/win-v' + version)) {
                throw new Error('Stable releases can be built only from main or its validated stable tags.');
              }
              const {data: main} = await github.rest.git.getRef({...context.repo, ref: 'heads/main'});
              const {data: comparison} = await github.rest.repos.compareCommits({...context.repo, base: source, head: main.object.sha});
              if (!['ahead', 'identical'].includes(comparison.status)) throw new Error('Stable release source is not part of main.');
              if (version === '1.10.0' && source === 'cd62afeedd2838cfa1dda814ed8c6b9369e794ed') {
                throw new Error('The retired stable PR test cannot be republished.');
              }
            }
            async function workflows(commitSha) {
              const {data: commit} = await github.rest.git.getCommit({...context.repo, commit_sha: commitSha});
              const {data: root} = await github.rest.git.getTree({...context.repo, tree_sha: commit.tree.sha});
              const gh = root.tree.find(e => e.path === '.github' && e.type === 'tree');
              if (!gh) return null;
              const {data: config} = await github.rest.git.getTree({...context.repo, tree_sha: gh.sha});
              return config.tree.find(e => e.path === 'workflows' && e.type === 'tree')?.sha ?? null;
            }
            if (isPr) {
              const {data: repo} = await github.rest.repos.get(context.repo);
              const {data: main} = await github.rest.git.getRef({...context.repo, ref: 'heads/' + repo.default_branch});
              if (await workflows(main.object.sha) !== await workflows(source)) {
                throw new Error('Default workflows changed during the beta build; rerun with a fresh source.');
              }
            }
            function provenance(body, label) {
              const lines = (body || '').split(/\r?\n/).filter(line => line.startsWith(label + ': '));
              if (lines.length !== 1) throw new Error('Missing unambiguous native provenance: ' + label);
              return lines[0].slice(label.length + 2);
            }
            async function macMetadata(ref) {
              const {data: file} = await github.rest.repos.getContent({
                ...context.repo, path: 'macos/Sources/EvictKit/Version.swift', ref
              });
              if (file.type !== 'file' || file.encoding !== 'base64' || file.size > 16384) throw new Error('Unsafe native version source.');
              const text = Buffer.from(file.content, 'base64').toString('utf8');
              const versions = [...text.matchAll(/public static let current\s*=\s*"([^"]+)"/g)];
              const builds = [...text.matchAll(/public static let build\s*=\s*"([^"]+)"/g)];
              if (versions.length !== 1 || builds.length !== 1 || !/^\d+\.\d+\.\d+$/.test(versions[0][1]) || !/^\d+$/.test(builds[0][1])) throw new Error('Ambiguous native version source.');
              return {version: versions[0][1], build: builds[0][1]};
            }
            const frozenMac = await macMetadata(source);
            if (frozenMac.version !== process.env.MAC_VERSION) throw new Error('Packaged Mac version differs from the frozen source.');
            // Read-only native packaging cannot authorize new binaries for the writer.
            // Independently bind its bytes to a completed native production verification.
            const nativeTag = process.env.MAC_RELEASE_TAG, nativeSource = process.env.MAC_RELEASE_SOURCE;
            const originMatch = /^(mac-v|win-v|v)(\d+\.\d+\.\d+)$/.exec(nativeTag);
            const runId = Number(process.env.MAC_VERIFICATION_RUN);
            if (!originMatch || !/^[a-f0-9]{40}$/.test(nativeSource) || !Number.isSafeInteger(runId) || runId <= 0 ||
                !/^[a-f0-9]{64}$/.test(process.env.MAC_SHA256)) throw new Error('Invalid native origin identity.');
            const isNative = originMatch[1] === 'mac-v';
            const {data: nativeRelease} = await github.rest.repos.getReleaseByTag({...context.repo, tag: nativeTag});
            if (nativeRelease.draft || nativeRelease.prerelease || nativeRelease.tag_name !== nativeTag ||
                provenance(nativeRelease.body, 'Built and tested release source') !== nativeSource) throw new Error('Native origin is not a stable source release.');
            let nativeTarget = (await github.rest.git.getRef({...context.repo, ref: 'tags/' + nativeTag})).data.object;
            for (let depth = 0; nativeTarget.type === 'tag' && depth < 5; depth++) nativeTarget = (await github.rest.git.getTag({...context.repo, tag_sha: nativeTarget.sha})).data.object;
            if (nativeTarget.type !== 'commit' || nativeTarget.sha !== nativeSource) throw new Error('Native release tag moved.');
            const {data: nativeAncestry} = await github.rest.repos.compareCommits({...context.repo, base: nativeSource, head: 'main'});
            if (!['ahead', 'identical'].includes(nativeAncestry.status)) throw new Error('Native stable source is not on main.');
            const originMac = await macMetadata(nativeSource);
            if (originMac.version !== frozenMac.version || originMac.build !== frozenMac.build ||
                (isNative ? originMatch[2] !== originMac.version : provenance(nativeRelease.body, 'macOS bundle version') !== originMac.version)) throw new Error('Native version/build does not match frozen Windows code.');
            const nativeName = isNative ? 'Evict-' + originMac.version + '-macOS-universal.dmg' : 'Evict_' + originMatch[2] + '.dmg';
            const originAssets = nativeRelease.assets.filter(asset => asset.name === nativeName);
            const originChecksums = nativeRelease.assets.filter(asset => asset.name === nativeName + '.sha256');
            const sizes = JSON.parse(process.env.ASSET_SIZES);
            if (originAssets.length !== 1 || originChecksums.length !== 1 || originAssets[0].state !== 'uploaded' || originChecksums[0].state !== 'uploaded' ||
                originAssets[0].size !== sizes['Evict_' + version + '.dmg'] || originAssets[0].digest !== 'sha256:' + process.env.MAC_SHA256) throw new Error('Packaged DMG differs from the verified native GitHub asset.');
            let original;
            if (isNative) {
              original = provenance(nativeRelease.body, 'Original source');
              if (!/^[a-f0-9]{40}$/.test(original) || provenance(nativeRelease.body, 'Verification run') !== 'https://github.com/' + process.env.GITHUB_REPOSITORY + '/actions/runs/' + runId) throw new Error('Unexpected native verification origin.');
              if (original !== nativeSource) {
                const {data: generated} = await github.rest.repos.getCommit({...context.repo, ref: nativeSource});
                if (!/^chore\(release\): macos \d+\.\d+\.\d+$/.test(generated.commit.message.split('\n')[0]) || generated.parents.length !== 1 || generated.parents[0].sha !== original ||
                    !generated.files?.length || generated.files.some(file => file.status !== 'modified' || !['macos/Sources/EvictKit/Version.swift', 'macos/CHANGELOG.md'].includes(file.filename))) throw new Error('Native release changed application code after its original source.');
              }
            } else {
              original = nativeSource;
              const managed = ['windows/Directory.Build.props', 'windows/installer/Evict.iss', 'windows/CHANGELOG.md', 'macos/Sources/EvictKit/Version.swift', 'macos/CHANGELOG.md'];
              let reachedTrigger = false;
              for (let depth = 0; depth < 8; depth++) {
                const {data: commit} = await github.rest.repos.getCommit({...context.repo, ref: original});
                if (!/^chore\(release\): (windows|macos) \d+\.\d+\.\d+$/.test(commit.commit.message.split('\n')[0])) { reachedTrigger = true; break; }
                if (commit.parents.length !== 1 || !commit.files?.length || commit.files.some(file => file.status !== 'modified' || !managed.includes(file.filename))) throw new Error('Legacy native metadata ancestry contains unrelated changes.');
                original = commit.parents[0].sha;
              }
              if (!reachedTrigger) throw new Error('Excessive legacy metadata ancestry.');
            }
            const {data: nativeRun} = await github.rest.actions.getWorkflowRun({...context.repo, run_id: runId});
            const date = value => { const parsed = Date.parse(value); if (!Number.isFinite(parsed)) throw new Error('Invalid native provenance time.'); return parsed; };
            if (nativeRun.status !== 'completed' || nativeRun.conclusion !== 'success' || nativeRun.head_sha !== original ||
                nativeRun.path !== '.github/workflows/' + (isNative ? 'macos.yml' : 'windows.yml') ||
                nativeRun.repository?.full_name !== process.env.GITHUB_REPOSITORY || nativeRun.head_repository?.full_name !== process.env.GITHUB_REPOSITORY ||
                !['push', 'workflow_dispatch'].includes(nativeRun.event) || date(nativeRun.created_at) > date(nativeRelease.published_at) ||
                date(nativeRelease.published_at) > date(nativeRun.updated_at) || [...originAssets, ...originChecksums].some(asset => date(asset.updated_at) > date(nativeRun.updated_at))) throw new Error('Native verification run is not completed for these published bytes.');
            const jobs = [];
            for (let page = 1; page <= 10; page++) {
              const {data: result} = await github.rest.actions.listJobsForWorkflowRun({...context.repo, run_id: runId, filter: 'latest', per_page: 100, page});
              jobs.push(...result.jobs);
              if (jobs.length === result.total_count) break;
              if (result.jobs.length !== 100 || page === 10) throw new Error('Native verification job pagination is incomplete.');
            }
            const requiredJobs = isNative ? {build: ['Build and verify Apple Silicon and Intel application'], publish: []} : {
              'mac-package': ['Build native universal macOS app', 'Prove the app opens (launch test)'],
              'verify-published-macos': ['Mount the downloaded image and verify native installation', 'Prove the published app opens after a drag-install (launch test)']
            };
            for (const [name, steps] of Object.entries(requiredJobs)) {
              const matches = jobs.filter(job => job.name === name);
              if (matches.length !== 1 || matches[0].status !== 'completed' || matches[0].conclusion !== 'success' ||
                  steps.some(step => { const found = (matches[0].steps || []).filter(item => item.name === step); return found.length !== 1 || found[0].conclusion !== 'success'; })) throw new Error('Native production verification job did not pass: ' + name);
            }
            const tag = 'win-v' + version;
            let release;
            try { release = (await github.rest.repos.getReleaseByTag({...context.repo, tag})).data; }
            catch (error) { if (error.status !== 404) throw error; }
            if (release && (release.prerelease !== prerelease ||
                (isPr && !(release.body || '').split(/\r?\n/).includes('Original PR head: ' + pr.head.sha)))) {
              throw new Error('The version is reserved by another channel or reviewed source.');
            }
            let target;
            try { target = (await github.rest.git.getRef({...context.repo, ref: 'tags/' + tag})).data.object; }
            catch (error) {
              if (error.status !== 404) throw error;
              if (release) throw new Error('A release exists without its immutable source tag.');
              // A beta is published only on the tag reserve-beta created; never create another one here.
              if (isPr) throw new Error('The beta tag ' + tag + ' was not reserved; rerun the workflow.');
              target = (await github.rest.git.createRef({...context.repo, ref: 'refs/tags/' + tag, sha: source})).data.object;
            }
            while (target.type === 'tag') target = (await github.rest.git.getTag({...context.repo, tag_sha: target.sha})).data.object;
            const expectedTarget = isPr ? tagSource : source;
            if (target.type !== 'commit' || target.sha !== expectedTarget) throw new Error('Release tag already points to another source; refusing to overwrite it.');
            core.setOutput('tag_source', expectedTarget);
            core.setOutput('publish', String(!release || release.draft));
            core.setOutput('prerelease', String(prerelease));
            core.setOutput('name', 'Evict ' + version + ' for Windows (includes macOS ' + frozenMac.version + ')' + (isPr ? ' — PR #' + pr.number + ' beta' : ''));
            let body = fsReadNotes();
            function fsReadNotes() {
              const fs = require('fs');
              const note = fs.lstatSync('Zip/release-notes.md');
              if (!note.isFile() || note.isSymbolicLink() || note.size > 100000) throw new Error('Unexpected release notes artifact.');
              return fs.readFileSync('Zip/release-notes.md', 'utf8').trim();
            }
            body += '\n\nRelease channel: ' + (isPr ? 'beta' : 'stable') +
              '\nBuilt and tested release source: ' + source +
              (isPr ? '\nOriginal PR head: ' + pr.head.sha + '\nReserved beta tag source: ' + tagSource +
                '\nBeta preview of [PR #' + pr.number + '](https://github.com/' + process.env.GITHUB_REPOSITORY + '/pull/' + pr.number + ').' : '\nSource branch: main') +
              '\nInstallation download: Evict_' + version + '.zip; root Evict_' + version + '/ contains portable/, windows-x64/ and macOS/, with two native EXEs and a verified native DMG.' +
              '\nmacOS bundle version: ' + process.env.MAC_VERSION +
              '\nmacOS bundle build: ' + frozenMac.build +
              '\nmacOS origin release: ' + nativeTag +
              '\nmacOS origin source: ' + nativeSource +
              '\nmacOS verification run: https://github.com/' + process.env.GITHUB_REPOSITORY + '/actions/runs/' + runId +
              '\nThe macOS installer is reused byte-for-byte from its verified native release; this Windows run does not rebuild macOS.' +
              (isPr ? '\nOnly managed core version metadata differs from the reviewed application source; workflows match main.' : '');
            core.setOutput('body', body);

      - name: Upload complete draft
        id: release
        if: steps.guard.outputs.publish == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: win-v${{ needs.package.outputs.version }}
          target_commitish: ${{ steps.guard.outputs.tag_source }}
          name: ${{ steps.guard.outputs.name }}
          body: ${{ steps.guard.outputs.body }}
          draft: true
          prerelease: ${{ steps.guard.outputs.prerelease == 'true' }}
          make_latest: false
          fail_on_unmatched_files: true
          files: |
            ReleaseInputs/Evict.exe
            ReleaseInputs/Evict.exe.sha256
            ReleaseInputs/Evict-Setup-*.exe
            ReleaseInputs/Evict-Setup-*.exe.sha256
            ReleaseInputs/Evict_*.dmg
            ReleaseInputs/Evict_*.dmg.sha256
            Zip/Evict_*.zip
            Zip/Evict_*.zip.sha256

      - name: Publish verified beta or main release
        if: steps.guard.outputs.publish == 'true'
        uses: actions/github-script@v9
        env:
          RELEASE_VERSION: ${{ needs.package.outputs.version }}
          RELEASE_SOURCE: ${{ needs.package.outputs.source_sha }}
          RELEASE_ID: ${{ steps.release.outputs.id }}
          RELEASE_ASSET_SIZES: ${{ steps.assets.outputs.sizes }}
          RELEASE_TAG_SOURCE: ${{ steps.guard.outputs.tag_source }}
        with:
          script: |
            const version = process.env.RELEASE_VERSION;
            const prerelease = context.eventName === 'pull_request';
            if (prerelease && !/^\d+\.\d+\.\d+-beta(?!000)\d{3}$/.test(version)) throw new Error('PR promotion requires a beta.');
            if (!prerelease && !/^\d+\.\d+\.\d+$/.test(version)) throw new Error('Main promotion requires x.y.z.');
            const release_id = Number(process.env.RELEASE_ID);
            if (!Number.isSafeInteger(release_id) || release_id <= 0) throw new Error('No release draft was created.');
            const {data: release} = await github.rest.repos.getRelease({...context.repo, release_id});
            if (!release.draft || release.prerelease !== prerelease || release.tag_name !== 'win-v' + version) {
              throw new Error('The release draft has unexpected channel metadata.');
            }
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {...context.repo, release_id, per_page: 100});
            const sizes = JSON.parse(process.env.RELEASE_ASSET_SIZES);
            const names = ['Evict.exe', 'Evict.exe.sha256', 'Evict-Setup-' + version + '.exe',
              'Evict-Setup-' + version + '.exe.sha256', 'Evict_' + version + '.dmg', 'Evict_' + version + '.dmg.sha256',
              'Evict_' + version + '.zip', 'Evict_' + version + '.zip.sha256'].sort();
            if (JSON.stringify(assets.map(a => a.name).sort()) !== JSON.stringify(names) ||
                assets.some(a => a.state !== 'uploaded' || a.size <= 0 || a.size !== sizes[a.name])) {
              throw new Error('Release assets are incomplete; leaving the draft unpublished.');
            }
            let target = (await github.rest.git.getRef({...context.repo, ref: 'tags/win-v' + version})).data.object;
            while (target.type === 'tag') target = (await github.rest.git.getTag({...context.repo, tag_sha: target.sha})).data.object;
            const expectedTarget = prerelease ? process.env.RELEASE_TAG_SOURCE : process.env.RELEASE_SOURCE;
            if (!/^[a-f0-9]{40}$/.test(expectedTarget || '') || target.type !== 'commit' || target.sha !== expectedTarget) {
              throw new Error('Release tag does not identify its tested (or reserved beta) source.');
            }
            let makeLatest = 'false';
            if (!prerelease) {
              makeLatest = 'true';
              const candidate = version.split('.').map(Number);
              const releases = await github.paginate(github.rest.repos.listReleases, {...context.repo, per_page: 100});
              for (const existing of releases) {
                if (existing.draft || existing.prerelease) continue;
                const match = existing.tag_name.match(/^(?:win-v|v)(\d+)\.(\d+)\.(\d+)$/);
                if (!match) continue;
                const previous = match.slice(1).map(Number);
                let cmp = 0;
                for (let i = 0; i < 3 && cmp === 0; i++) cmp = Math.sign(candidate[i] - previous[i]);
                if (cmp <= 0) makeLatest = 'false';
              }
            }
            const {data: published} = await github.rest.repos.updateRelease({
              ...context.repo, release_id, draft: false, prerelease, make_latest: makeLatest
            });
            if (published.draft || published.prerelease !== prerelease) throw new Error('Release publication was not confirmed.');
            await core.summary.addHeading(prerelease ? 'Beta published' : 'Main release published')
              .addLink(version, published.html_url).write();

  # Published update checks execute reviewed source and installers only in a separate read-only job.
  verify-published-update:
    needs: [package, publish]
    if: always() && needs.package.result == 'success' && needs.package.outputs.publish == 'true' && needs.publish.result == 'success'
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.package.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up .NET 8 for published update checks
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Download and verify published release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.package.outputs.version }}
          RELEASE_CHANNEL: ${{ needs.package.outputs.channel }}
          RELEASE_SOURCE_SHA: ${{ needs.package.outputs.source_sha }}
          BETA_TAG_SOURCE: ${{ needs.package.outputs.beta_tag_source }}
        run: |
          $v = $env:RELEASE_VERSION
          $channel = $env:RELEASE_CHANNEL
          $mac = '${{ needs.package.outputs.mac_version }}'
          if ($v -notmatch '^\d+\.\d+\.\d+(?:-beta(?!000)\d{3})?$' -or $channel -notin @("stable", "beta")) {
            throw "Invalid published release-test identity"
          }
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json"; "X-GitHub-Api-Version" = "2022-11-28" }
          $api = "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY"
          $release = Invoke-RestMethod -Uri "$api/releases/tags/win-v$v" -Headers $headers
          if ($release.draft -or $release.tag_name -ne "win-v$v" -or [bool]$release.prerelease -ne ($channel -eq "beta")) {
            throw "The published release has unexpected version/channel metadata"
          }
          $tag = Invoke-RestMethod -Uri "$api/git/ref/tags/win-v$v" -Headers $headers
          $target = $tag.object
          while ($target.type -eq "tag") {
            $annotated = Invoke-RestMethod -Uri "$api/git/tags/$($target.sha)" -Headers $headers
            $target = $annotated.object
          }
          # A beta tag is reserved on the reviewed PR source; the tested source adds only managed version metadata.
          $expectedTagSource = if ($channel -eq "beta") { $env:BETA_TAG_SOURCE } else { $env:RELEASE_SOURCE_SHA }
          if ($expectedTagSource -notmatch '^[a-f0-9]{40}$' -or $target.type -ne "commit" -or $target.sha -ne $expectedTagSource) {
            throw "Published release source does not match the reviewed immutable source"
          }
          $names = @("Evict.exe", "Evict.exe.sha256", "Evict-Setup-$v.exe", "Evict-Setup-$v.exe.sha256", "Evict_$v.dmg", "Evict_$v.dmg.sha256", "Evict_$v.zip", "Evict_$v.zip.sha256") | Sort-Object
          $assets = Invoke-RestMethod -Uri "$api/releases/$($release.id)/assets?per_page=100" -Headers $headers
          $actual = @($assets.name | Sort-Object)
          if ($actual.Count -ne $names.Count -or ($actual -join [char]10) -cne ($names -join [char]10)) {
            throw "Published release must contain exactly its eight expected assets"
          }
          New-Item -ItemType Directory -Path PublishedAssets -Force | Out-Null
          foreach ($asset in $assets) {
            if ($asset.state -ne "uploaded" -or $asset.size -le 0) { throw "Published asset is incomplete: $($asset.name)" }
            $uri = [Uri]$asset.browser_download_url
            if ($uri.Scheme -ne "https" -or $uri.Host -ne "github.com" -or
                -not $uri.AbsolutePath.StartsWith("/$env:GITHUB_REPOSITORY/releases/download/win-v$v/", [StringComparison]::Ordinal)) {
              throw "Unexpected published asset download URL"
            }
            $out = Join-Path PublishedAssets $asset.name
            # Public asset downloads receive no repository token, including on redirects.
            # GitHub's release CDN intermittently answers 504 for some assets; retry each download a few times.
            for ($try = 1; ; $try++) {
              try { Invoke-WebRequest -Uri $uri -OutFile $out -TimeoutSec 120; break }
              catch {
                if ($try -ge 8) { throw }
                Write-Host "Download of $($asset.name) failed ($($_.Exception.Message)); retry $($try + 1) of 8"
                Start-Sleep -Seconds (10 * $try)
              }
            }
            if ((Get-Item -LiteralPath $out).Length -ne $asset.size) { throw "Downloaded asset size mismatch: $($asset.name)" }
          }
          foreach ($name in @("Evict.exe", "Evict-Setup-$v.exe", "Evict_$v.dmg", "Evict_$v.zip")) {
            $file = Join-Path PublishedAssets $name
            $expected = (Get-Content -LiteralPath "$file.sha256" -Raw).Trim()
            if ($expected -notmatch '^[a-fA-F0-9]{64}$' -or (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash -ne $expected) {
              throw "Downloaded release checksum mismatch: $name"
            }
          }
          $product = [Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path PublishedAssets/Evict.exe).Path).ProductVersion
          if (($product -replace '\+.*$', '') -ne $v) { throw "Downloaded Evict ProductVersion is $product instead of $v" }
          $setupInfo = [Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path "PublishedAssets/Evict-Setup-$v.exe").Path)
          $setupCore = "$($setupInfo.FileMajorPart).$($setupInfo.FileMinorPart).$($setupInfo.FileBuildPart).$($setupInfo.FilePrivatePart)"
          if ($setupCore -ne "$($v.Split('-')[0]).0") { throw "Downloaded installer numeric version mismatch: $setupCore" }
          $archive = [IO.Compression.ZipFile]::OpenRead((Resolve-Path "PublishedAssets/Evict_$v.zip").Path)
          try {
            $root = "Evict_$v"
            $expectedEntries = @("$root/portable/Evict_$v.exe", "$root/windows-x64/Evict_$v.exe", "$root/macOS/Evict_$v.dmg") | Sort-Object
            $entries = @($archive.Entries | ForEach-Object { $_.FullName } | Sort-Object)
            if ($entries.Count -ne 3 -or ($entries -join [char]10) -cne ($expectedEntries -join [char]10)) {
              throw "Downloaded ZIP violates the versioned portable/windows-x64/macOS layout"
            }
            $rawAssets = @{
              "$root/portable/Evict_$v.exe" = "Evict.exe"
              "$root/windows-x64/Evict_$v.exe" = "Evict-Setup-$v.exe"
              "$root/macOS/Evict_$v.dmg" = "Evict_$v.dmg"
            }
            foreach ($entry in $archive.Entries) {
              $name = $rawAssets[$entry.FullName]
              $stream = $entry.Open()
              try { $zipHash = (Get-FileHash -InputStream $stream -Algorithm SHA256).Hash }
              finally { $stream.Dispose() }
              $rawHash = (Get-FileHash -LiteralPath (Join-Path PublishedAssets $name) -Algorithm SHA256).Hash
              if ($zipHash -ne $rawHash) { throw "ZIP content differs from the published raw asset: $name" }
            }
          }
          finally { $archive.Dispose() }
          Write-Host "Published $channel $v verified: eight assets, SHA256, ZIP, source tag, ProductVersion $product and installer $setupCore"

      - name: Verify downloaded ZIP, native disk image and frozen component version
        env:
          RELEASE_VERSION: ${{ needs.package.outputs.version }}
          MAC_VERSION: ${{ needs.package.outputs.mac_version }}
        shell: pwsh
        run: |
          @'
          import importlib.util, os, pathlib, re, zipfile
          spec = importlib.util.spec_from_file_location("release_zip", "build/release_zip.py")
          helper = importlib.util.module_from_spec(spec); spec.loader.exec_module(helper)
          archive = pathlib.Path("PublishedAssets", "Evict_" + os.environ["RELEASE_VERSION"] + ".zip")
          helper.check_zip(archive)
          source = pathlib.Path("../macos/Sources/EvictKit/Version.swift").read_text()
          expected = re.search(r'public static let current\s*=\s*"([^"]+)"', source).group(1)
          assert expected == os.environ["MAC_VERSION"]
          with zipfile.ZipFile(archive) as package:
              name = "Evict_" + os.environ["RELEASE_VERSION"] + "/macOS/Evict_" + os.environ["RELEASE_VERSION"] + ".dmg"
              with package.open(name) as native:
                  helper.check_dmg(native, package.getinfo(name).file_size, name)
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Downloaded Mac build or exact three-folder package verification failed' }

      - name: Restore published updater test dependencies
        run: dotnet restore tests/Evict.Core.Tests/Evict.Core.Tests.csproj

      - name: Test installed update discovery and verified download
        env:
          EVICT_PUBLISHED_UPDATE_TEST_VERSION: ${{ needs.package.outputs.version }}
          EVICT_PUBLISHED_UPDATE_TEST_CHANNEL: ${{ needs.package.outputs.channel }}
        run: dotnet test tests/Evict.Core.Tests/Evict.Core.Tests.csproj -c Release --no-restore -p:Version=${{ needs.package.outputs.version }} -p:InformationalVersion=${{ needs.package.outputs.version }} --filter FullyQualifiedName~PublishedUpdateScenarioTests --logger "trx;LogFileName=published-update.trx"

      - name: Native smoke against the downloaded installer
        shell: pwsh
        run: |
          pwsh -NoProfile -File build/installer_smoke.ps1 -SetupPath "PublishedAssets/Evict-Setup-${{ needs.package.outputs.version }}.exe" -PackagedExe "PublishedAssets/Evict.exe"
          if ($LASTEXITCODE -ne 0) { throw "Downloaded installer smoke failed with exit code $LASTEXITCODE" }

  # The native pipeline performs signing, universal-architecture and launch checks.
  # Re-verify provenance and byte-for-byte equality here without starting a Mac runner.
  verify-published-macos:
    needs: [package, publish]
    if: always() && needs.package.result == 'success' && needs.package.outputs.publish == 'true' && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.package.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.package.outputs.mac_artifact }}
          path: MacProvenance
      - name: Verify published Mac bytes against the original verified release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.package.outputs.version }}
          RELEASE_SOURCE: ${{ needs.package.outputs.source_sha }}
          RELEASE_CHANNEL: ${{ needs.package.outputs.channel }}
          BETA_TAG_SOURCE: ${{ needs.package.outputs.beta_tag_source }}
        run: |
          python scripts/fetch_macos_bundle.py --verify-published --windows-version "$RELEASE_VERSION" \
            --source-sha "$RELEASE_SOURCE" --channel "$RELEASE_CHANNEL" --tag-source "$BETA_TAG_SOURCE" \
            --provenance MacProvenance/mac-provenance.json --out PublishedMac

  cleanup-beta-source:
    needs: [prepare-beta, freeze-beta, pr-build, mac-package, package, publish, verify-published-update, verify-published-macos]
    if: always() && github.event_name == 'pull_request' && (needs.prepare-beta.outputs.temp_ref != '' || needs.freeze-beta.outputs.source_sha != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/github-script@v9
        env:
          PREPARED_REF: ${{ needs.prepare-beta.outputs.temp_ref }}
          PREPARED_SOURCE: ${{ needs.prepare-beta.outputs.source_sha }}
          FROZEN_SOURCE: ${{ needs.freeze-beta.outputs.source_sha }}
        with:
          script: |
            const suffix = '/pr-' + context.payload.pull_request.number + '/run-' + context.runId + '-attempt-' + process.env.GITHUB_RUN_ATTEMPT;
            const owned = [
              {ref: process.env.PREPARED_REF, expected: 'heads/beta-build' + suffix, sha: process.env.PREPARED_SOURCE},
              {ref: process.env.FROZEN_SOURCE ? 'heads/beta-versioned' + suffix : '', expected: 'heads/beta-versioned' + suffix, sha: process.env.FROZEN_SOURCE}
            ];
            for (const {ref, expected, sha} of owned) {
              if (!ref) continue;
              if (ref !== expected || !/^[a-f0-9]{40}$/.test(sha)) throw new Error('Unexpected temporary source ref identity.');
              let current;
              try { current = (await github.rest.git.getRef({...context.repo, ref})).data; }
              catch (error) { if (error.status === 404) continue; throw error; }
              if (current.object.sha !== sha) throw new Error('Temporary source ref changed; leaving it intact.');
              await github.rest.git.deleteRef({...context.repo, ref});
            }


  # Delete transfer files only after every consumer has successfully finished.
  # This job executes inline API calls with no checkout and no repository code.
  cleanup-artifacts:
    needs: [build, pr-build, plan-beta, mac-package, package, publish, verify-published-update, verify-published-macos]
    if: always() && needs.package.result == 'success' && (needs.package.outputs.publish == 'false' || (needs.publish.result == 'success' && needs.verify-published-update.result == 'success' && needs.verify-published-macos.result == 'success')) && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.repo.full_name == github.repository && github.event.pull_request.user.type == 'User' && github.event.sender.type == 'User' && !endsWith(github.actor, '[bot]')))
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Retain final installation download and remove verified transfers
        uses: actions/github-script@v9
        env:
          FINAL_ARTIFACT: ${{ needs.package.outputs.artifact }}
          FINAL_ARTIFACT_ID: ${{ needs.package.outputs.artifact_id }}
          INTERNAL_WINDOWS: ${{ needs.pr-build.outputs.artifact || needs.build.outputs.artifact }}-windows
          INTERNAL_MAC: ${{ needs.mac-package.outputs.artifact }}
          INTERNAL_ZIP: ${{ needs.package.outputs.transport_artifact }}-release-zip
          GENERATED_ARTIFACT: ${{ needs.plan-beta.outputs.manifest_artifact }}
          PACKAGE_RESULT: ${{ needs.package.result }}
          PUBLISH_REQUIRED: ${{ needs.package.outputs.publish }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          VERIFY_RESULT: ${{ needs.verify-published-update.result == 'success' && needs.verify-published-macos.result == 'success' && 'success' || 'failure' }}
        with:
          script: |
            // Cleanup runs without checkout and receives only artifact metadata from successful jobs.
            const EXPECTED_REPOSITORY = 'krishnabhunia/evict-uninstaller';
            const WORKFLOW_PATH = '.github/workflows/windows.yml';
            const VERSION_PATTERN = '(?:0|[1-9]\\d*)\\.(?:0|[1-9]\\d*)\\.(?:0|[1-9]\\d*)(?:-beta(?!000)\\d{3})?';
            const VERSIONED_FINAL = new RegExp('^Evict_(' + VERSION_PATTERN + ')$');
            const NATIVE_ZIP = new RegExp('^(Evict-' + VERSION_PATTERN + '-([a-f0-9]{40}))-release-zip$');
            const LEGACY_FINAL = new RegExp('^Evict-(' + VERSION_PATTERN + ')-([a-f0-9]{40})$');
            const NATIVE_WINDOWS = new RegExp('^(Evict-' + VERSION_PATTERN + '-([a-f0-9]{40}))-windows$');
            // One-time migration of the three reviewed successful runs; never sweep workflow history.
            const LEGACY_RUN_IDS = [37663956345, 37663958842, 37739868099];
            const MAX_PAGES = 5;
            const PAGE_SIZE = 100;
            
            function positiveInteger(value) {
