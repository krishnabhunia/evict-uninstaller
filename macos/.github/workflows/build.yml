name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Run tests
        run: swift test

      - name: Build Evict.app (universal)
        run: Scripts/make-app.sh --universal

      - name: Verify the bundle
        run: |
          test -x build/Evict.app/Contents/MacOS/Evict
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" build/Evict.app/Contents/Info.plist
          lipo -info build/Evict.app/Contents/MacOS/Evict
          codesign --verify --verbose=2 build/Evict.app

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: Evict-app
          path: |
            build/Evict-*.zip
            build/Evict-*.zip.sha256
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/Evict-*.zip
            build/Evict-*.zip.sha256
          generate_release_notes: true
